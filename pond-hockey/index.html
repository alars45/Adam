<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>5 Hole Pond Hockey Attack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; height: 100%; background: #06142a; color: #fff; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none;
  }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Press Start 2P', monospace;
  }
  canvas { display: block; }
  #pad {
    display: none; margin-top: 8px;
    grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(3, 48px);
    grid-template-areas: ". u ." "l . r" ". d .";
    gap: 4px;
  }
  #pad button {
    font: inherit; font-size: 18px; color: #ffc107; background: #0b2440;
    border: 2px solid #4aa3e8; border-radius: 10px; touch-action: none;
  }
  #pad button:active { background: #4aa3e8; }
  #pad .u { grid-area: u; } #pad .l { grid-area: l; } #pad .r { grid-area: r; } #pad .d { grid-area: d; }
  @media (pointer: coarse) { #pad { display: grid; } }
</style>
</head>
<body>
<canvas id="game" aria-label="Summit Youth Hockey 5 Hole Pond Hockey Attack game"></canvas>
<div id="pad">
  <button class="u" data-d="0" aria-label="Up">&#9650;</button>
  <button class="l" data-d="1" aria-label="Left">&#9664;</button>
  <button class="r" data-d="3" aria-label="Right">&#9654;</button>
  <button class="d" data-d="2" aria-label="Down">&#9660;</button>
</div>
<script>
(() => {
  'use strict';

  // ---------- constants ----------
  const T = 16, COLS = 28, ROWS = 31, TOP = 3, BOTTOM = 2;
  const W = COLS * T, H = (ROWS + TOP + BOTTOM) * T;
  const BASE = 75.75625 / 8;  // tiles per second at "100%" arcade speed
  const STEP = 1 / 60;
  const FONT = "'Press Start 2P', monospace";

  // # wall, . dot, o power pellet, - ghost house door, space empty
  const MAZE = [
    '############################',
    '#............##............#',
    '#.####.#####.##.#####.####.#',
    '#o####.#####.##.#####.####o#',
    '#.####.#####.##.#####.####.#',
    '#..........................#',
    '#.####.##.########.##.####.#',
    '#.####.##.########.##.####.#',
    '#......##....##....##......#',
    '######.##### ## #####.######',
    '     #.##### ## #####.#     ',
    '     #.##          ##.#     ',
    '     #.## ###--### ##.#     ',
    '######.## #      # ##.######',
    '      .   #      #   .      ',
    '######.## #      # ##.######',
    '     #.## ######## ##.#     ',
    '     #.##          ##.#     ',
    '     #.## ######## ##.#     ',
    '######.## ######## ##.######',
    '#............##............#',
    '#.####.#####.##.#####.####.#',
    '#.####.#####.##.#####.####.#',
    '#o..##.......  .......##..o#',
    '###.##.##.########.##.##.###',
    '###.##.##.########.##.##.###',
    '#......##....##....##......#',
    '#.##########.##.##########.#',
    '#.##########.##.##########.#',
    '#..........................#',
    '############################',
  ];

  // Order matters: it is the arcade's tie-break order for ghost decisions.
  const DIRS = [{ x: 0, y: -1 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 1, y: 0 }];
  const UP = DIRS[0], LEFT = DIRS[1], DOWN = DIRS[2];
  const KEYMAP = {
    ArrowUp: 0, KeyW: 0, ArrowLeft: 1, KeyA: 1, ArrowDown: 2, KeyS: 2, ArrowRight: 3, KeyD: 3,
  };
  const opposite = d => DIRS.find(o => o.x === -d.x && o.y === -d.y);

  // Bonus items appear twice per period, worth the same as the arcade's fruit.
  const FRUITS = [
    { name: 'cocoa', pts: 100 }, { name: 'orange slices', pts: 300 }, { name: 'water bottle', pts: 500 },
    { name: 'stick tape', pts: 700 }, { name: 'helmet', pts: 1000 }, { name: 'gloves', pts: 2000 },
    { name: 'stick', pts: 3000 }, { name: 'trophy', pts: 5000 },
  ];
  // The opposing big kids; `name` picks the arcade ghost personality each one plays with.
  const ROSTER = [
    { name: 'blinky', build: 'muscular', color: '#e53935', role: 'ENFORCER', nick: 'BRUISER' },
    { name: 'pinky', build: 'tall', color: '#ec6fcf', role: 'BEANPOLE', nick: 'STRETCH' },
    { name: 'inky', build: 'average', color: '#2ecc40', role: 'GRINDER', nick: 'AVERAGE JOE' },
    { name: 'clyde', build: 'fat', color: '#ff9800', role: 'BIG GUY', nick: 'MEATBALL' },
  ];
  const fruitIndex = L => L <= 2 ? L - 1 : L >= 13 ? 7 : Math.floor((L + 1) / 2);

  // Difficulty table modelled on the arcade's per-level settings.
  function levelSpec(L) {
    const tier = L === 1 ? 0 : L <= 4 ? 1 : 2;
    return {
      pac: L >= 21 ? 0.9 : [0.8, 0.9, 1][tier],
      pacFright: [0.9, 0.95, 1][tier],
      ghost: [0.75, 0.85, 0.95][tier],
      ghostFright: [0.5, 0.55, 0.6][tier],
      tunnel: [0.4, 0.45, 0.5][tier],
      elroy1: [0.8, 0.9, 1][tier],
      elroy2: [0.85, 0.95, 1.05][tier],
      elroyDots: [20, 30, 40, 40, 40, 50, 50, 50, 60, 60, 60, 80, 80, 80, 100, 100, 100, 100][L - 1] ?? 120,
      fright: [6, 5, 4, 3, 2, 5, 2, 2, 1, 5, 2, 1, 1, 3, 1, 1, 0, 1][L - 1] ?? 0,
      flashes: [5, 5, 5, 5, 5, 5, 5, 5, 3, 5, 5, 3, 3, 5, 3, 3, 0, 3][L - 1] ?? 0,
      // alternating scatter / chase durations (seconds); chase forever afterwards
      modes: [[7, 20, 7, 20, 5, 20, 5], [7, 20, 7, 20, 5, 1033, 1 / 60], [5, 20, 5, 20, 5, 1037, 1 / 60]][tier],
      // cumulative dots before each ghost (blinky, pinky, inky, clyde) leaves the house
      release: L === 1 ? [0, 0, 30, 90] : L === 2 ? [0, 0, 0, 50] : [0, 0, 0, 0],
      idle: L >= 5 ? 3 : 4,
      fruit: fruitIndex(L),
    };
  }

  // ---------- canvas ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const pad = document.getElementById('pad');
  let scale = 1, mazeIce, mazeFlash, titleBg;

  function resize() {
    const padH = getComputedStyle(pad).display === 'none' ? 0 : pad.offsetHeight + 8;
    const fit = Math.max(0.3, Math.min(innerWidth / W, (innerHeight - padH) / H));
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = Math.floor(W * fit) + 'px';
    canvas.style.height = Math.floor(H * fit) + 'px';
    scale = fit * dpr;
    canvas.width = Math.round(W * scale);
    canvas.height = Math.round(H * scale);
    mazeIce = renderMaze(false);
    mazeFlash = renderMaze(true);
    titleBg = renderTitleBg();
  }

  function rrect(g, x, y, w, h, r) {
    g.beginPath();
    if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h);
  }

  function mulberry32(a) {
    return () => {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Tiles the skater can never reach are off the pond: drawn as snow and pine trees.
  const OUTSIDE = (() => {
    const seen = MAZE.map(r => [...r].map(() => false));
    const stack = [[13, 23]];
    while (stack.length) {
      const [c0, r] = stack.pop();
      if (r < 0 || r >= ROWS) continue;
      const c = (c0 + COLS) % COLS;
      if (seen[r][c] || MAZE[r][c] === '#' || MAZE[r][c] === '-') continue;
      seen[r][c] = true;
      for (const d of DIRS) stack.push([c + d.x, r + d.y]);
    }
    const inBox = (c, r) => c >= 11 && c <= 16 && r >= 13 && r <= 15;
    return MAZE.map((row, r) => [...row].map((ch, c) => ch === ' ' && !seen[r][c] && !inBox(c, r)));
  })();

  function drawPine(g, x, y, s, snowy = true) {
    g.fillStyle = '#5d4037';
    g.fillRect(x - 1 * s, y + 3 * s, 2 * s, 4 * s);
    for (let k = 0; k < 3; k++) {
      const ty = y - 6 * s + k * 3.5 * s, w = (3 + k * 2) * s;
      g.fillStyle = snowy ? '#1b5e20' : '#0b1f2a';
      g.beginPath();
      g.moveTo(x, ty - 3 * s); g.lineTo(x + w, ty + 4 * s); g.lineTo(x - w, ty + 4 * s);
      g.fill();
      if (snowy) {
        g.fillStyle = '#ffffff';
        g.beginPath();
        g.moveTo(x, ty - 3 * s); g.lineTo(x + w * 0.45, ty + 0.3 * s); g.lineTo(x - w * 0.45, ty + 0.3 * s);
        g.fill();
      }
    }
  }

  // Pre-render the pond: scratched blue ice, snowbank walls, the penalty box.
  function renderMaze(flash) {
    const cv = document.createElement('canvas');
    cv.width = Math.round(W * scale);
    cv.height = Math.round(ROWS * T * scale);
    const g = cv.getContext('2d');
    g.scale(scale, scale);
    const MH = ROWS * T, rnd = mulberry32(2024);

    const ice = g.createLinearGradient(0, 0, W, MH);
    ice.addColorStop(0, flash ? '#e3f4ff' : '#2a7cc7');
    ice.addColorStop(0.5, flash ? '#ffffff' : '#4aa3e8');
    ice.addColorStop(1, flash ? '#e3f4ff' : '#2a74bd');
    g.fillStyle = ice;
    g.fillRect(0, 0, W, MH);
    if (!flash) {
      g.fillStyle = 'rgba(255,255,255,0.07)';  // sheen
      for (let i = 0; i < 7; i++) {
        const x0 = rnd() * W * 1.4 - W * 0.2, w = 20 + rnd() * 50;
        g.beginPath();
        g.moveTo(x0, 0); g.lineTo(x0 + w, 0); g.lineTo(x0 + w - MH * 0.5, MH); g.lineTo(x0 - MH * 0.5, MH);
        g.fill();
      }
      g.lineCap = 'round';
      for (let i = 0; i < 160; i++) {  // skate marks
        const x = rnd() * W, y = rnd() * MH, len = 8 + rnd() * 36, a = rnd() * Math.PI * 2;
        g.strokeStyle = `rgba(255,255,255,${0.12 + rnd() * 0.2})`;
        g.lineWidth = 0.5 + rnd() * 0.6;
        g.beginPath();
        g.moveTo(x, y);
        g.quadraticCurveTo(x + Math.cos(a) * len / 2 + (rnd() - 0.5) * 12, y + Math.sin(a) * len / 2 + (rnd() - 0.5) * 12,
          x + Math.cos(a) * len, y + Math.sin(a) * len);
        g.stroke();
      }
      g.strokeStyle = 'rgba(12,52,110,0.28)';  // cracks
      g.lineWidth = 0.8;
      for (let i = 0; i < 14; i++) {
        let x = rnd() * W, y = rnd() * MH;
        g.beginPath();
        g.moveTo(x, y);
        for (let k = 0; k < 5; k++) { x += (rnd() - 0.5) * 26; y += (rnd() - 0.5) * 26; g.lineTo(x, y); }
        g.stroke();
      }
    }

    g.fillStyle = flash ? '#cfd8dc' : '#263845';
    g.fillRect(11 * T, 13 * T, 6 * T, 3 * T);
    g.font = `6px ${FONT}`;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillStyle = '#7f98ab';
    g.fillText('PENALTY BOX', 14 * T, 15.5 * T);

    const solid = (c, r) => {
      if (r < 0 || r >= ROWS) return true;
      if (c < 0 || c >= COLS) return r !== 14;
      return MAZE[r][c] === '#' || OUTSIDE[r][c];
    };
    const bank = (inset, dy, color, rad) => {
      g.fillStyle = color;
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
        if (!solid(c, r)) continue;
        const L = !solid(c - 1, r), R = !solid(c + 1, r), U = !solid(c, r - 1), D = !solid(c, r + 1);
        // overlap neighbouring snow tiles slightly so no seams show when scaled
        const l = L ? inset : -0.5, rt = R ? inset : -0.5, tp = U ? inset : -0.5, bt = D ? inset : -0.5;
        rrect(g, c * T + l, r * T + tp + dy, T - l - rt, T - tp - bt,
          [L && U ? rad : 0, R && U ? rad : 0, R && D ? rad : 0, L && D ? rad : 0]);
        g.fill();
      }
    };
    bank(2, 2.5, flash ? '#b0bec5' : '#1d5a99', 6);   // shadow on the ice
    bank(2, 0, flash ? '#ffffff' : '#c4def5', 6);     // shaded snow
    bank(3.5, -1, '#ffffff', 5);                       // fresh snow on top
    if (!flash) {
      g.fillStyle = '#a9cdee';
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
        if (MAZE[r][c] !== '#' || rnd() < 0.5) continue;
        g.fillRect(c * T + 4 + rnd() * 8, r * T + 4 + rnd() * 8, 1.2, 1.2);
      }
    }
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (OUTSIDE[r][c] && (c + r) % 2 === 0) drawPine(g, c * T + T / 2, r * T + T / 2, 1);
    }

    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (MAZE[r][c] !== '-') continue;
      g.fillStyle = '#e53935';
      g.fillRect(c * T, r * T + T / 2 - 2, T, 4);
      g.fillStyle = '#ffffff';
      g.fillRect(c * T + 6, r * T + T / 2 - 2, 4, 4);
    }
    return cv;
  }

  function mountainRange(g, rnd, base, minY, maxY, col, shade, snow, n) {
    const step = W / n, peaks = [], valleys = [];
    for (let i = -1; i <= n + 1; i++) peaks.push({ x: i * step + (rnd() - 0.5) * step * 0.5, y: minY + rnd() * (maxY - minY) });
    g.fillStyle = col;
    g.beginPath();
    g.moveTo(-10, base);
    peaks.forEach((p, i) => {
      g.lineTo(p.x, p.y);
      const q = peaks[i + 1];
      if (!q) return;
      const low = Math.max(p.y, q.y);
      const v = { x: (p.x + q.x) / 2 + (rnd() - 0.5) * 10, y: low + (base - low) * (0.35 + rnd() * 0.25) };
      valleys.push(v);
      g.lineTo(v.x, v.y);
    });
    g.lineTo(W + 10, base);
    g.closePath();
    g.fill();
    peaks.forEach((p, i) => {
      const lv = valleys[i - 1] || { x: p.x - 60, y: base }, rv = valleys[i] || { x: p.x + 60, y: base };
      g.fillStyle = shade;
      g.beginPath();
      g.moveTo(p.x, p.y); g.lineTo(rv.x, rv.y); g.lineTo(rv.x, base); g.lineTo(p.x + (rv.x - p.x) * 0.2, base);
      g.closePath();
      g.fill();
      // snowcap with a jagged lower edge
      const f = 0.3 + rnd() * 0.12;
      const a = { x: p.x + (lv.x - p.x) * f, y: p.y + (lv.y - p.y) * f };
      const b = { x: p.x + (rv.x - p.x) * f, y: p.y + (rv.y - p.y) * f };
      g.fillStyle = snow;
      g.beginPath();
      g.moveTo(p.x, p.y);
      g.lineTo(b.x, b.y);
      for (let j = 1; j < 5; j++) {
        const t = j / 5;
        g.lineTo(b.x + (a.x - b.x) * t, b.y + (a.y - b.y) * t + (j % 2 ? 5 : -1));
      }
      g.lineTo(a.x, a.y);
      g.closePath();
      g.fill();
    });
  }

  // Title backdrop: dusk sky, snowcapped mountains, pines and a frozen pond.
  function renderTitleBg() {
    const cv = document.createElement('canvas');
    cv.width = Math.round(W * scale);
    cv.height = Math.round(H * scale);
    const g = cv.getContext('2d');
    g.scale(scale, scale);
    const rnd = mulberry32(99), HZ = 13.5 * T;

    const sky = g.createLinearGradient(0, 0, 0, HZ);
    sky.addColorStop(0, '#081233');
    sky.addColorStop(0.55, '#2b2f6e');
    sky.addColorStop(0.85, '#8a5a8f');
    sky.addColorStop(1, '#f2a36b');
    g.fillStyle = sky;
    g.fillRect(0, 0, W, HZ);
    for (let i = 0; i < 70; i++) {
      g.fillStyle = `rgba(255,255,255,${0.3 + rnd() * 0.7})`;
      g.fillRect(rnd() * W, rnd() * HZ * 0.55, 1.2, 1.2);
    }
    g.fillStyle = 'rgba(255,248,225,0.15)';
    g.beginPath(); g.arc(W * 0.84, 2.6 * T, 22, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#fff8e1';
    g.beginPath(); g.arc(W * 0.84, 2.6 * T, 12, 0, Math.PI * 2); g.fill();

    mountainRange(g, rnd, HZ, 6.4 * T, 9.2 * T, '#4b4f8f', '#3a3e78', '#eef2ff', 5);
    mountainRange(g, rnd, HZ, 8.6 * T, 11 * T, '#2a2e60', '#1f2350', '#ffffff', 4);
    for (let x = -4; x < W + 8; x += 7 + rnd() * 6) drawPine(g, x, HZ - 6 - rnd() * 6, 1 + rnd() * 0.6, false);

    const pond = g.createLinearGradient(0, HZ, 0, H);
    pond.addColorStop(0, '#2e6fa8');
    pond.addColorStop(0.15, '#173f6b');
    pond.addColorStop(1, '#06142a');
    g.fillStyle = pond;
    g.fillRect(0, HZ, W, H - HZ);
    g.fillStyle = '#e8f1ff';
    g.beginPath();
    g.moveTo(0, HZ + 4);
    for (let x = 0; x <= W; x += 16) g.quadraticCurveTo(x + 8, HZ - 2 + rnd() * 2, x + 16, HZ + 2 + rnd() * 3);
    g.lineTo(W, HZ - 2);
    g.lineTo(0, HZ - 2);
    g.fill();
    g.strokeStyle = 'rgba(255,255,255,0.08)';
    g.lineWidth = 1;
    for (let i = 0; i < 40; i++) {
      const x = rnd() * W, y = HZ + 10 + rnd() * (H - HZ - 10), len = 10 + rnd() * 40;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + len, y + (rnd() - 0.5) * 6); g.stroke();
    }
    return cv;
  }

  // ---------- audio ----------
  let ac = null, master = null, noiseBuf = null, siren = null, sirenGain = null, muted = false, wakaFlip = false, sirenPhase = 0;

  function initAudio() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return; }
    master = ac.createGain();
    master.gain.value = muted ? 0 : 0.5;
    master.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const data = noiseBuf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    siren = ac.createOscillator();
    siren.type = 'triangle';
    sirenGain = ac.createGain();
    sirenGain.gain.value = 0;
    siren.connect(sirenGain).connect(master);
    siren.start();
  }

  function tone(freq, dur, { type = 'square', vol = 0.08, to = null, at = 0 } = {}) {
    if (!ac) return;
    const t0 = ac.currentTime + at;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(master);
    o.start(t0);
    o.stop(t0 + dur + 0.02);
  }

  function noise(dur, { vol = 0.2, type = 'bandpass', freq = 2500, to = null, q = 1, at = 0 } = {}) {
    if (!ac) return;
    const t0 = ac.currentTime + at;
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noiseBuf;
    f.type = type;
    f.Q.value = q;
    f.frequency.setValueAtTime(freq, t0);
    if (to) f.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f).connect(g).connect(master);
    src.start(t0, Math.random() * 0.5);
    src.stop(t0 + dur + 0.02);
  }

  // A referee's pea whistle: a high tone with a fast trill.
  function whistle(dur, at = 0) {
    if (!ac) return;
    const t0 = ac.currentTime + at;
    const o = ac.createOscillator(), lfo = ac.createOscillator(), depth = ac.createGain(), g = ac.createGain();
    o.frequency.value = 2900;
    lfo.frequency.value = 28;
    depth.gain.value = 180;
    lfo.connect(depth).connect(o.frequency);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.09, t0 + 0.03);
    g.gain.setValueAtTime(0.09, t0 + dur - 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(master);
    o.start(t0); lfo.start(t0);
    o.stop(t0 + dur + 0.02); lfo.stop(t0 + dur + 0.02);
  }

  const sfx = {
    scrape() {
      wakaFlip = !wakaFlip;
      noise(0.07, { vol: 0.22, freq: wakaFlip ? 3800 : 2600, to: wakaFlip ? 2600 : 3800, q: 1.5 });
    },
    slapshot() {
      noise(0.09, { type: 'lowpass', freq: 2500, to: 300, vol: 0.6 });
      tone(95, 0.15, { type: 'sine', vol: 0.35, to: 40 });
    },
    check() {
      tone(130, 0.28, { type: 'sine', vol: 0.4, to: 45 });
      noise(0.18, { type: 'lowpass', freq: 900, to: 150, vol: 0.5 });
      tone(600, 0.12, { type: 'triangle', vol: 0.08, to: 1200, at: 0.15 });
    },
    item() { [1047, 1319, 1568].forEach((f, i) => tone(f, 0.12, { type: 'triangle', vol: 0.12, at: i * 0.07 })); },
    extra() { for (let i = 0; i < 4; i++) tone(1320, 0.1, { vol: 0.06, at: i * 0.15 }); },
    death() {
      whistle(0.35);
      whistle(0.6, 0.45);
      for (let i = 0; i < 6; i++) tone(520 - i * 50, 0.18, { type: 'triangle', vol: 0.12, to: 470 - i * 50, at: 1.15 + i * 0.16 });
    },
    horn() {
      if (!ac) return;
      const t0 = ac.currentTime;
      const f = ac.createBiquadFilter(), g = ac.createGain();
      f.type = 'lowpass';
      f.frequency.value = 1400;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.12, t0 + 0.08);
      g.gain.setValueAtTime(0.12, t0 + 1.6);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.1);
      f.connect(g).connect(master);
      for (const fr of [155, 196, 233, 311]) {
        const o = ac.createOscillator();
        o.type = 'sawtooth';
        o.frequency.value = fr;
        o.connect(f);
        o.start(t0);
        o.stop(t0 + 2.2);
      }
    },
    intro() {
      // an original rink-organ style start-up tune
      const notes = [
        [523, 0], [659, .15], [784, .3], [1047, .45], [784, .75], [1047, .9],
        [587, 1.2], [740, 1.35], [880, 1.5], [1175, 1.65], [880, 1.95], [1175, 2.1],
        [659, 2.4], [784, 2.55], [988, 2.7], [1319, 2.85], [1175, 3.15], [1319, 3.3], [1568, 3.5],
      ];
      for (const [f, at] of notes) {
        tone(f, 0.16, { vol: 0.04, at });
        tone(f / 2, 0.16, { type: 'triangle', vol: 0.08, at });
      }
      const bass = [[131, 0], [196, .6], [147, 1.2], [220, 1.8], [165, 2.4], [247, 3.0], [262, 3.5]];
      for (const [f, at] of bass) tone(f, 0.4, { type: 'triangle', vol: 0.15, at });
    },
  };

  function updateSiren(dt) {
    if (!ac) return;
    let f = 300, vol = 0;
    if (state === 'play' && !paused) {
      sirenPhase += dt;
      if (ghosts.some(g => g.state === 'eaten' || g.state === 'entering')) {
        f = 700 + 500 * ((sirenPhase * 7) % 1); vol = 0.035;
      } else if (frightTime > 0) {
        f = 190 + 160 * ((sirenPhase * 9) % 1); vol = 0.035;
      } else {
        const stage = Math.min(4, Math.floor((1 - dotsLeft / dotsTotal) * 5));
        const tri = Math.abs(((sirenPhase * (2.2 + stage * 0.5)) % 1) * 2 - 1);
        f = 340 + stage * 60 + 260 * tri; vol = 0.025;
      }
    }
    const now = ac.currentTime;
    siren.frequency.setTargetAtTime(f, now, 0.01);
    sirenGain.gain.setTargetAtTime(vol, now, 0.03);
  }

  function toggleMute() {
    muted = !muted;
    if (master) master.gain.setTargetAtTime(muted ? 0 : 0.5, ac.currentTime, 0.01);
  }

  // ---------- game state ----------
  let state = 'title', timer = 0, paused = false, clock = 0;
  let grid, dotsLeft, dotsTotal, score = 0, lives = 0, level = 1, extraGiven = false;
  let hi = 0;
  try { hi = +localStorage.getItem('pond-hockey-hi') || 0; } catch {}
  let spec, pac, ghosts = [], want = null;
  let modeIdx, modeTime, frightTime, eatCount, dotCounter, idleTime, deathRelease;
  let fruit = null, levelFruits = [], popups = [], eatenGhost = null, deathSfxPlayed = false;

  function saveHi() {
    try { localStorage.setItem('pond-hockey-hi', String(hi)); } catch {}
  }

  function tileAt(c, r) {
    if (r < 0 || r >= ROWS) return '#';
    return grid[r][(c + COLS) % COLS];
  }
  const pacOpen = (c, r) => { const t = tileAt(c, r); return t !== '#' && t !== '-'; };
  const ghostOpen = pacOpen;

  function makeGhost(i, x, y, st, scatter) {
    return { ...ROSTER[i], x, y, state: st, dir: st === 'active' ? LEFT : UP, scatter, fright: false, bob: -1, phase: i * 1.7, face: -1 };
  }

  function resetActors() {
    pac = { x: 14, y: 23.5, dir: LEFT, face: -1, moving: true, stall: 0, anim: 0 };
    ghosts = [
      makeGhost(0, 14, 11.5, 'active', { x: 25, y: -3 }),
      makeGhost(1, 14, 14.5, 'house', { x: 2, y: -3 }),
      makeGhost(2, 12, 14.5, 'house', { x: 27, y: 31 }),
      makeGhost(3, 16, 14.5, 'house', { x: 0, y: 31 }),
    ];
    ghosts[2].bob = 1;
    ghosts[3].bob = 1;
    want = null;
    modeIdx = 0; modeTime = 0; frightTime = 0; eatCount = 0;
    dotCounter = 0; idleTime = 0;
    fruit = null; eatenGhost = null;
  }

  function startLevel(first) {
    spec = levelSpec(level);
    grid = MAZE.map(r => r.split(''));
    dotsTotal = dotsLeft = MAZE.join('').split('').filter(c => c === '.' || c === 'o').length;
    resetActors();
    deathRelease = false;
    levelFruits.push(spec.fruit);
    if (levelFruits.length > 7) levelFruits.shift();
    state = 'ready';
    timer = first ? 4.2 : 2;
    if (first) sfx.intro();
  }

  function newGame() {
    score = 0; lives = 3; level = 1; extraGiven = false;
    levelFruits = []; popups = []; paused = false;
    startLevel(true);
  }

  function addScore(n) {
    score += n;
    if (!extraGiven && score >= 10000) { extraGiven = true; lives++; sfx.extra(); }
    if (score > hi) hi = score;
  }

  // ---------- movement ----------
  // Moves an entity along its direction, calling onCenter whenever it sits
  // exactly on a tile centre so it can turn or stop.
  function advance(e, dist, onCenter) {
    for (let guard = 0; dist > 1e-7 && guard < 8; guard++) {
      const cx = Math.floor(e.x) + 0.5, cy = Math.floor(e.y) + 0.5;
      if (Math.abs(e.x - cx) < 1e-6 && Math.abs(e.y - cy) < 1e-6) {
        e.x = cx; e.y = cy;
        if (onCenter(e) === false) return;
      }
      const d = e.dir;
      const ahead = (cx - e.x) * d.x + (cy - e.y) * d.y;
      const tx = ahead > 1e-6 ? cx : cx + d.x, ty = ahead > 1e-6 ? cy : cy + d.y;
      const rem = Math.abs(tx - e.x) + Math.abs(ty - e.y);
      const step = Math.min(dist, rem);
      e.x += d.x * step; e.y += d.y * step;
      dist -= step;
      if (step === rem) { e.x = tx; e.y = ty; }
      if (e.x < 0) e.x += COLS; else if (e.x >= COLS) e.x -= COLS;
    }
  }

  function pacAtCenter(p) {
    const c = Math.floor(p.x), r = Math.floor(p.y);
    if (want && pacOpen(c + want.x, r + want.y)) p.dir = want;
    if (!pacOpen(c + p.dir.x, r + p.dir.y)) { p.moving = false; return false; }
  }

  function movePac(dt) {
    if (pac.stall > 0) { pac.stall -= dt; return; }
    if (want && want === opposite(pac.dir)) { pac.dir = want; pac.moving = true; }
    if (!pac.moving) {
      const c = Math.floor(pac.x), r = Math.floor(pac.y);
      if (want && pacOpen(c + want.x, r + want.y)) { pac.dir = want; pac.moving = true; }
      else return;
    }
    const dist = BASE * (frightTime > 0 ? spec.pacFright : spec.pac) * dt;
    advance(pac, dist, pacAtCenter);
    if (pac.moving) pac.anim += dist;
    eatTile();
  }

  function eatTile() {
    const c = Math.floor(pac.x), r = Math.floor(pac.y);
    const t = grid[r][c];
    if (t !== '.' && t !== 'o') return;
    grid[r][c] = ' ';
    dotsLeft--;
    dotCounter++;
    idleTime = 0;
    sfx.scrape();
    if (t === '.') { addScore(10); pac.stall = 1 / 60; }
    else { addScore(50); pac.stall = 3 / 60; powerUp(); }
    const eaten = dotsTotal - dotsLeft;
    if (eaten === 70 || eaten === 170) fruit = { t: 9 + Math.random(), idx: spec.fruit };
  }

  function powerUp() {
    eatCount = 0;
    for (const g of ghosts) {
      if (g.state === 'active') g.dir = opposite(g.dir);
      if (g.state !== 'eaten' && g.state !== 'entering') g.fright = spec.fright > 0;
    }
    if (spec.fright > 0) { frightTime = spec.fright; sfx.slapshot(); }
  }

  const elroy = () => dotsLeft <= spec.elroyDots / 2 ? 2 : dotsLeft <= spec.elroyDots ? 1 : 0;
  const isChase = () => modeIdx % 2 === 1;

  function ghostSpeed(g) {
    if (g.state === 'eaten' || g.state === 'entering') return BASE * 1.6;
    if (g.state === 'house' || g.state === 'leaving') return BASE * 0.5;
    const c = Math.floor(g.x), r = Math.floor(g.y);
    if (r === 14 && (c < 6 || c > 21)) return BASE * spec.tunnel;
    if (g.fright) return BASE * spec.ghostFright;
    if (g.name === 'blinky') {
      const e = elroy();
      if (e === 2) return BASE * spec.elroy2;
      if (e === 1) return BASE * spec.elroy1;
    }
    return BASE * spec.ghost;
  }

  function ghostTarget(g) {
    if (g.state === 'eaten') return { x: 13, y: 11 };
    const pc = Math.floor(pac.x), pr = Math.floor(pac.y), d = pac.dir;
    const cruise = g.name === 'blinky' && elroy() > 0;
    if (!isChase() && !cruise) return g.scatter;
    switch (g.name) {
      case 'blinky': return { x: pc, y: pr };
      case 'pinky':  // includes the arcade's "up also shifts left" quirk
        return { x: pc + d.x * 4 - (d === UP ? 4 : 0), y: pr + d.y * 4 };
      case 'inky': {
        const b = ghosts[0];
        const vx = pc + d.x * 2 - (d === UP ? 2 : 0), vy = pr + d.y * 2;
        return { x: 2 * vx - Math.floor(b.x), y: 2 * vy - Math.floor(b.y) };
      }
      default: {
        const dx = Math.floor(g.x) - pc, dy = Math.floor(g.y) - pr;
        return dx * dx + dy * dy > 64 ? { x: pc, y: pr } : g.scatter;
      }
    }
  }

  function ghostAtCenter(g) {
    const c = Math.floor(g.x), r = Math.floor(g.y);
    if (g.state === 'eaten' && r === 11 && (c === 13 || c === 14)) { g.state = 'entering'; return false; }
    const back = opposite(g.dir);
    const opts = DIRS.filter(d => d !== back && ghostOpen(c + d.x, r + d.y));
    if (!opts.length) { g.dir = back; return; }
    if (g.fright) { g.dir = opts[Math.floor(Math.random() * opts.length)]; return; }
    const t = ghostTarget(g);
    let best = opts[0], bestD = Infinity;
    for (const d of opts) {
      const dx = c + d.x - t.x, dy = r + d.y - t.y, dd = dx * dx + dy * dy;
      if (dd < bestD) { bestD = dd; best = d; }
    }
    g.dir = best;
  }

  // Slides a ghost toward the house column, then vertically to ty.
  function houseMove(g, sp, ty) {
    if (Math.abs(g.x - 14) > 1e-6) {
      const s = Math.sign(14 - g.x);
      g.x += s * Math.min(sp, Math.abs(14 - g.x));
      g.dir = s < 0 ? LEFT : DIRS[3];
      return false;
    }
    if (Math.abs(g.y - ty) > 1e-6) {
      const s = Math.sign(ty - g.y);
      g.y += s * Math.min(sp, Math.abs(ty - g.y));
      g.dir = s < 0 ? UP : DOWN;
      return false;
    }
    return true;
  }

  function moveGhost(g, dt) {
    const sp = ghostSpeed(g) * dt;
    switch (g.state) {
      case 'house':
        g.y += g.bob * sp;
        if (g.y < 14) { g.y = 14; g.bob = 1; } else if (g.y > 15) { g.y = 15; g.bob = -1; }
        g.dir = g.bob < 0 ? UP : DOWN;
        break;
      case 'leaving':
        if (houseMove(g, sp, 11.5)) { g.state = 'active'; g.dir = LEFT; }
        break;
      case 'entering':
        if (houseMove(g, sp, 14.5)) { g.state = 'leaving'; g.fright = false; }
        break;
      default:
        advance(g, sp, ghostAtCenter);
    }
  }

  function releaseGhosts(dt) {
    const limits = deathRelease ? [0, 7, 17, 32] : spec.release;
    const next = ghosts.find(g => g.state === 'house');
    if (!next) return;
    idleTime += dt;
    if (dotCounter >= limits[ghosts.indexOf(next)] || idleTime >= spec.idle) {
      next.state = 'leaving';
      idleTime = 0;
    }
  }

  function wrapDist(a, b) {
    let dx = Math.abs(a.x - b.x);
    dx = Math.min(dx, COLS - dx);
    return Math.hypot(dx, a.y - b.y);
  }

  const CALLS = ['5-HOLE!', 'DANGLE!', 'SNIPE!', 'TOP SHELF!'];

  function checkCollisions() {
    for (const g of ghosts) {
      if (g.state !== 'active' || wrapDist(pac, g) > 0.5) continue;
      if (g.fright) {
        g.fright = false;
        g.state = 'eaten';
        eatCount++;
        const pts = 200 * 2 ** (eatCount - 1);
        addScore(pts);
        popups.push({ x: g.x, y: g.y, text: CALLS[eatCount - 1], sub: String(pts), color: '#ffc107', t: 1, size: 8 });
        eatenGhost = g;
        state = 'eatPause';
        timer = 1;
        sfx.check();
      } else {
        state = 'dying';
        timer = 0;
        deathSfxPlayed = false;
      }
      return;
    }
  }

  function stepPlay(dt) {
    if (frightTime > 0) {
      frightTime -= dt;
      if (frightTime <= 0) { frightTime = 0; for (const g of ghosts) g.fright = false; }
    } else if (modeIdx < spec.modes.length) {
      modeTime += dt;
      if (modeTime >= spec.modes[modeIdx]) {
        modeTime = 0;
        modeIdx++;
        for (const g of ghosts) if (g.state === 'active') g.dir = opposite(g.dir);
      }
    }
    releaseGhosts(dt);
    movePac(dt);
    checkCollisions();
    if (state !== 'play') return;
    for (const g of ghosts) moveGhost(g, dt);
    checkCollisions();
    if (state !== 'play') return;

    if (fruit) {
      fruit.t -= dt;
      if (fruit.t <= 0) fruit = null;
      else if (wrapDist(pac, { x: 14, y: 17.5 }) < 0.7) {
        const pts = FRUITS[fruit.idx].pts;
        addScore(pts);
        popups.push({ x: 14, y: 17.5, text: String(pts), color: '#ffffff', t: 2, size: 8 });
        fruit = null;
        sfx.item();
      }
    }
    if (dotsLeft === 0) { state = 'levelDone'; timer = 0; fruit = null; sfx.horn(); }
  }

  function update(dt) {
    if (paused) { updateSiren(dt); return; }
    clock += dt;
    for (const p of popups) p.t -= dt;
    popups = popups.filter(p => p.t > 0);

    switch (state) {
      case 'ready':
        timer -= dt;
        if (timer <= 0) state = 'play';
        break;
      case 'play':
        stepPlay(dt);
        break;
      case 'eatPause':
        timer -= dt;
        if (timer <= 0) { state = 'play'; eatenGhost = null; }
        break;
      case 'dying':
        timer += dt;
        if (timer >= 1 && !deathSfxPlayed) { deathSfxPlayed = true; sfx.death(); }
        if (timer >= 3) {
          lives--;
          if (lives <= 0) { state = 'gameover'; timer = 4; saveHi(); }
          else { resetActors(); deathRelease = true; state = 'ready'; timer = 2; }
        }
        break;
      case 'levelDone':
        timer += dt;
        if (timer >= 3.2) { level++; saveHi(); startLevel(false); }
        break;
      case 'gameover':
        timer -= dt;
        if (timer <= 0) state = 'title';
        break;
    }
    updateSiren(dt);
  }

  // ---------- drawing ----------
  const px = x => x * T;
  const py = y => (y + TOP) * T;
  const periodName = L => L <= 3 ? `PERIOD ${L}` : L === 4 ? 'OVERTIME' : `${L - 3}X OVERTIME`;
  const periodShort = L => L <= 3 ? `P${L}` : L === 4 ? 'OT' : `${L - 3}OT`;

  function text(str, x, y, color, size = 8, align = 'center', stroke = null) {
    ctx.font = `${size}px ${FONT}`;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    if (stroke) {
      ctx.lineJoin = 'round';
      ctx.lineWidth = Math.max(3, size / 4);
      ctx.strokeStyle = stroke;
      ctx.strokeText(str, x, y);
    }
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }

  function ellipse(x, y, rx, ry) {
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawStar(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4, rr = i % 2 ? r * 0.4 : r;
      ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.fill();
  }

  // Sprites are drawn facing right in local pixels, ground at y = 12.
  function drawSkate(fx) {
    ctx.fillStyle = '#151515';
    rrect(ctx, fx - 3, 8.5, 7, 3.2, [2, 1, 1, 1]);
    ctx.fill();
    ctx.strokeStyle = '#e3eaee';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(fx - 3.5, 12.6);
    ctx.lineTo(fx + 4.5, 12.6);
    ctx.stroke();
  }

  function drawLegs(stride, width, socks, wobble = 0) {
    for (const s of [-1, 1]) {
      const fx = s * (stride + wobble);
      ctx.strokeStyle = socks;
      ctx.lineWidth = width;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(s * 1.5, 4);
      ctx.lineTo(fx, 9);
      ctx.stroke();
      drawSkate(fx);
    }
  }

  function drawStick(hx, hy, bladeX) {
    ctx.strokeStyle = '#4e342e';
    ctx.lineWidth = 1.8;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(hx - 2, hy - 3);
    ctx.lineTo(bladeX, 11.5);
    ctx.lineTo(bladeX + 5, 12);
    ctx.stroke();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(bladeX + 1.5, 11.7);
    ctx.lineTo(bladeX + 4.5, 12);
    ctx.stroke();
  }

  // The hero: a Summit youth player in a gold jersey and navy helmet.
  function drawKid(x, y, faceRight, anim, death = null, s = 1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    if (death !== null) {
      const k = Math.min(1, death * 1.8);
      ctx.translate(0, 5 * k);
      ctx.rotate((faceRight ? -1 : 1) * k * Math.PI / 2);
      if (death > 1) ctx.globalAlpha = Math.max(0, 1 - (death - 1) * 4);
    }
    if (!faceRight) ctx.scale(-1, 1);
    const stride = death === null ? Math.sin(anim * Math.PI * 1.4) * 3.5 : 2;
    drawLegs(stride, 3.6, '#ffc107');
    ctx.fillStyle = '#111';
    rrect(ctx, -5, 1.5, 10, 4.5, 2);
    ctx.fill();
    ctx.fillStyle = '#ffc107';
    rrect(ctx, -5.5, -5.5, 11, 8.5, 3);
    ctx.fill();
    ctx.fillStyle = '#0d2a6b';
    ctx.fillRect(-5.5, 0, 11, 1.6);
    ctx.strokeStyle = '#ffc107';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, -3.5);
    ctx.lineTo(5, 0);
    ctx.stroke();
    drawStick(6, 0.5, 11);
    ctx.fillStyle = '#0d2a6b';
    ellipse(5.5, 0.5, 2, 2);
    // face, helmet shell, cage
    ctx.fillStyle = '#ffd3ad';
    ellipse(1.5, -9, 4.2, 4.2);
    ctx.fillStyle = '#0d2a6b';
    ctx.beginPath();
    ctx.arc(0.8, -9.5, 4.8, Math.PI * 0.95, Math.PI * 2.05);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0.3, -9, 4.6, Math.PI * 0.5, Math.PI * 1.5);
    ctx.fill();
    ctx.fillStyle = '#111';
    ellipse(3.4, -8.6, 0.8, 0.9);
    ctx.strokeStyle = '#d5dde2';
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.moveTo(4.6, -10.5); ctx.lineTo(4.6, -5.2);
    ctx.moveTo(6.1, -9.8); ctx.lineTo(6.1, -6);
    ctx.moveTo(3, -8); ctx.lineTo(6.3, -8);
    ctx.moveTo(3, -6.2); ctx.lineTo(6.1, -6.2);
    ctx.stroke();
    ctx.restore();

    if (death !== null && death < 1.05) {
      const hx = x + (faceRight ? -9.5 : 9.5) * s, hy = y + 4 * s;
      for (let i = 0; i < 3; i++) {
        const a = clock * 6 + i * Math.PI * 2 / 3;
        drawStar(hx + Math.cos(a) * 7, hy - 6 + Math.sin(a) * 2.5, 2.4, '#ffeb3b');
      }
    }
  }

  // Opponents: four body types (sizes in local pixels).
  const BUILDS = {
    muscular: { sh: 8, wa: 4.5, top: -6, bot: 3, head: -10.5, hr: 4.3, arm: 4.2, leg: 4, stride: 3.5 },
    tall: { sh: 4.5, wa: 3.8, top: -10, bot: 3, head: -14.5, hr: 4.1, arm: 2.6, leg: 3, stride: 4 },
    average: { sh: 5.5, wa: 5, top: -5.5, bot: 3, head: -9.5, hr: 4.5, arm: 3.2, leg: 3.5, stride: 3.5 },
    fat: { sh: 6, wa: 8.5, top: -5, bot: 4, head: -9.5, hr: 4.8, arm: 3.6, leg: 4.5, stride: 2.5, belly: true },
  };

  const SPRITE = 1.25;  // in-game sprite scale

  function drawPlayer(p, x, y, s = SPRITE) {
    const b = BUILDS[p.build];
    const benched = p.state === 'eaten' || p.state === 'entering';
    const fright = p.fright && !benched;
    const flashWindow = spec ? spec.flashes * 0.4 : 0;
    const white = fright && inGame() && frightTime < flashWindow && Math.floor(frightTime / 0.2) % 2 === 0;
    if (p.dir.x) p.face = p.dir.x;
    const right = p.face > 0;
    const look = { x: right ? p.dir.x : -p.dir.x, y: p.dir.y };
    const jersey = fright ? (white ? '#ffffff' : '#1a237e') : p.color;
    const trim = fright ? (white ? '#e53935' : '#90caf9') : '#ffffff';

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(right ? s : -s, s);
    const hy = benched ? -2 : b.head;
    if (!benched) {
      const stride = Math.sin(clock * 7 + p.phase) * b.stride;
      const wobble = fright ? Math.sin(clock * 40) * 1.3 : 0;  // weak ankles!
      drawLegs(stride, b.leg, jersey, wobble);
      ctx.fillStyle = '#222';
      rrect(ctx, -b.wa - 0.5, b.bot - 2, (b.wa + 0.5) * 2, 5, 2);
      ctx.fill();
      ctx.fillStyle = jersey;
      if (b.belly) {
        ellipse(0.5, -0.5, b.wa, 6.5);
      } else {
        ctx.beginPath();
        ctx.moveTo(-b.sh, b.top + 2);
        ctx.quadraticCurveTo(-b.sh, b.top, -b.sh + 2, b.top);
        ctx.lineTo(b.sh - 2, b.top);
        ctx.quadraticCurveTo(b.sh, b.top, b.sh, b.top + 2);
        ctx.lineTo(b.wa, b.bot);
        ctx.lineTo(-b.wa, b.bot);
        ctx.closePath();
        ctx.fill();
      }
      ctx.fillStyle = trim;
      ctx.fillRect(-b.wa + (b.belly ? 1.5 : 0), b.bot - 3, (b.wa - (b.belly ? 1.5 : 0)) * 2, 1.4);
      const shX = b.sh * 0.4, shY = b.top + 2;
      ctx.strokeStyle = jersey;
      ctx.lineWidth = b.arm;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(shX, shY);
      ctx.lineTo(shX + 4, shY + 4.5);
      ctx.stroke();
      if (p.build === 'muscular') { ctx.fillStyle = jersey; ellipse(shX + 1.8, shY + 1.8, 3.2, 2.6); }
      const hx = shX + 4.5, hdy = shY + 5;
      drawStick(hx, hdy, hx + 5);
      ctx.fillStyle = '#222';
      ellipse(hx, hdy, 1.9, 1.9);
      ctx.fillStyle = '#ffd3ad';
      ellipse(0.6, hy + 0.6, b.hr * 0.92, b.hr * 0.92);
    }
    // helmet (a benched player's helmet slides back to the penalty box on its own)
    ctx.fillStyle = fright ? jersey : p.color;
    ctx.beginPath();
    ctx.arc(0, hy - 0.4, b.hr, Math.PI, 0);
    ctx.lineTo(b.hr, hy - 0.4);
    ctx.lineTo(-b.hr, hy - 0.4);
    ctx.fill();
    ctx.fillRect(-b.hr, hy - 0.8, 2.2, 4);
    // eyes and brows
    for (const ex of [-0.2, 2.6]) {
      ctx.fillStyle = '#fff';
      ellipse(ex, hy + 0.9, 1.35, 1.6);
      ctx.fillStyle = fright ? '#e53935' : '#111';
      ellipse(ex + look.x * 0.6, hy + 0.9 + look.y * 0.7, 0.8, 0.8);
    }
    if (!benched) {
      ctx.strokeStyle = fright ? (white ? '#e53935' : '#90caf9') : '#111';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      if (fright) {
        // worried brows and a wobbly mouth
        ctx.moveTo(-1.4, hy - 0.4); ctx.lineTo(0.8, hy - 1.2);
        ctx.moveTo(1.6, hy - 1.2); ctx.lineTo(3.8, hy - 0.4);
        ctx.moveTo(-0.8, hy + 3.4);
        for (let i = 1; i <= 4; i++) ctx.lineTo(-0.8 + i * 1.05, hy + 3.4 + (i % 2 ? -0.7 : 0));
      } else {
        // angry brows and a grimace
        ctx.moveTo(-1.4, hy - 1.2); ctx.lineTo(0.8, hy - 0.4);
        ctx.moveTo(1.6, hy - 0.4); ctx.lineTo(3.8, hy - 1.2);
        ctx.moveTo(0, hy + 3.3); ctx.lineTo(2.8, hy + 3.1);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawPuck(x, y, glow = 0) {
    if (glow > 0) {
      ctx.fillStyle = `rgba(255,255,255,${glow})`;
      ellipse(x, y + 0.5, 9, 7);
    }
    ctx.fillStyle = '#000';
    ellipse(x, y + 2, 6.5, 3.6);
    ctx.fillRect(x - 6.5, y - 1, 13, 3);
    ctx.fillStyle = '#2c2c2c';
    ellipse(x, y - 1, 6.5, 3.6);
    ctx.strokeStyle = '#5a5a5a';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.ellipse(x, y - 1, 4.8, 2.5, 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Bonus items, worth the same as the arcade's fruit.
  function drawItem(idx, x, y) {
    ctx.save();
    ctx.translate(x, y);
    ctx.lineCap = 'round';
    switch (FRUITS[idx].name) {
      case 'cocoa':
        ctx.strokeStyle = '#c62828'; ctx.lineWidth = 1.8;
        ctx.beginPath(); ctx.arc(4.5, 1.5, 2.6, -Math.PI / 2, Math.PI / 2); ctx.stroke();
        ctx.fillStyle = '#c62828'; rrect(ctx, -5, -3, 9.5, 9.5, 2); ctx.fill();
        ctx.fillStyle = '#6d4c41'; ellipse(-0.25, -3, 4.7, 1.4);
        ctx.fillStyle = '#fff'; ctx.fillRect(-2.5, -4.2, 2, 1.6); ctx.fillRect(0.8, -4, 2, 1.6);
        ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.moveTo(-1.5, -6); ctx.quadraticCurveTo(-3, -8, -1, -10); ctx.moveTo(1.5, -6); ctx.quadraticCurveTo(0, -8, 2, -10); ctx.stroke();
        break;
      case 'orange slices':
        for (const [ox, oy] of [[-3, 2], [3, 0]]) {
          ctx.fillStyle = '#ef6c00'; ctx.beginPath(); ctx.arc(ox, oy, 5.5, Math.PI, 0); ctx.fill();
          ctx.fillStyle = '#ffb74d'; ctx.beginPath(); ctx.arc(ox, oy, 4.2, Math.PI, 0); ctx.fill();
          ctx.strokeStyle = '#fff3e0'; ctx.lineWidth = 0.6; ctx.beginPath();
          for (const a of [0.25, 0.5, 0.75]) { ctx.moveTo(ox, oy); ctx.lineTo(ox - Math.cos(a * Math.PI) * 4.2, oy - Math.sin(a * Math.PI) * 4.2); }
          ctx.stroke();
        }
        break;
      case 'water bottle':
        ctx.fillStyle = '#4fc3f7'; rrect(ctx, -3.5, -5, 7, 13, 2.5); ctx.fill();
        ctx.fillStyle = '#ffc107'; ctx.fillRect(-3.5, 0, 7, 2.5);
        ctx.fillStyle = '#2e7d32'; ctx.fillRect(-2, -7.5, 4, 3); ctx.fillRect(-0.6, -10, 1.2, 2.5);
        break;
      case 'stick tape':
        ctx.strokeStyle = '#fafafa'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(0, 0, 5.5, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = '#b0bec5'; ctx.lineWidth = 0.6;
        ctx.beginPath(); ctx.arc(0, 0, 3.4, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = '#fafafa'; ctx.fillRect(5, 0, 4, 2.5);
        break;
      case 'helmet':
        ctx.fillStyle = '#0d2a6b';
        ctx.beginPath(); ctx.arc(0, 1, 7, Math.PI, 0); ctx.lineTo(7, 4); ctx.lineTo(-7, 4); ctx.fill();
        ctx.strokeStyle = '#d5dde2'; ctx.lineWidth = 0.8; ctx.beginPath();
        for (const gx of [2, 4.5, 7]) { ctx.moveTo(gx, 0); ctx.lineTo(gx, 6); }
        ctx.moveTo(1.5, 3); ctx.lineTo(7.5, 3); ctx.moveTo(1.5, 6); ctx.lineTo(7.5, 6);
        ctx.stroke();
        break;
      case 'gloves':
        ctx.fillStyle = '#c62828'; rrect(ctx, -6, -7, 11, 10, 3.5); ctx.fill();
        ctx.fillStyle = '#212121'; rrect(ctx, -7, 2, 13, 5, 1.5); ctx.fill();
        ctx.strokeStyle = '#7f0000'; ctx.lineWidth = 0.8; ctx.beginPath();
        for (const fx of [-3, 0, 3]) { ctx.moveTo(fx, -7); ctx.lineTo(fx, -2); }
        ctx.stroke();
        break;
      case 'stick':
        ctx.strokeStyle = '#8d6e63'; ctx.lineWidth = 2.2;
        ctx.beginPath(); ctx.moveTo(-6, -9); ctx.lineTo(3, 6); ctx.lineTo(9, 7); ctx.stroke();
        ctx.strokeStyle = '#212121'; ctx.lineWidth = 2.4;
        ctx.beginPath(); ctx.moveTo(-6, -9); ctx.lineTo(-4.5, -6.5); ctx.moveTo(4, 6.2); ctx.lineTo(8.5, 7); ctx.stroke();
        break;
      default:  // trophy
        ctx.fillStyle = '#ffca28';
        ctx.beginPath(); ctx.moveTo(-5.5, -8); ctx.lineTo(5.5, -8); ctx.quadraticCurveTo(5, 0, 0, 1); ctx.quadraticCurveTo(-5, 0, -5.5, -8); ctx.fill();
        ctx.strokeStyle = '#ffca28'; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.arc(-5.5, -5, 2.5, Math.PI / 2, Math.PI * 1.5); ctx.moveTo(5.5, -7.5); ctx.arc(5.5, -5, 2.5, -Math.PI / 2, Math.PI / 2); ctx.stroke();
        ctx.fillRect(-1, 0, 2, 4);
        ctx.fillStyle = '#6d4c41'; ctx.fillRect(-5, 4, 10, 4);
        ctx.fillStyle = '#fff59d'; ctx.fillRect(-3.5, -7, 1.5, 4);
    }
    ctx.restore();
  }

  function drawDots() {
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.1;
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (grid[r][c] !== '.') continue;
      const cx = c * T + T / 2, cy = (r + TOP) * T + T / 2;
      for (let k = 0; k < 3; k++) {
        const dx = Math.cos(k * Math.PI / 3) * 2.7, dy = Math.sin(k * Math.PI / 3) * 2.7;
        ctx.moveTo(cx - dx, cy - dy);
        ctx.lineTo(cx + dx, cy + dy);
      }
    }
    ctx.stroke();
    const glow = state === 'play' ? 0.25 + 0.2 * Math.sin(clock * 8) : 0;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (grid[r][c] === 'o') drawPuck(c * T + T / 2, (r + TOP) * T + T / 2, glow);
    }
  }

  function drawHUD() {
    const blink = state === 'title' || Math.floor(clock * 3) % 2 === 0;
    if (blink) text('HOME', 3 * T, T * 0.6, '#ffc107', 12, 'left');
    text(String(score).padStart(2, '0'), 7 * T, T * 1.7, '#fff', 12, 'right');
    text('HIGH SCORE', W / 2, T * 0.6, '#fff', 12);
    text(String(hi).padStart(2, '0'), W / 2 + 3 * T, T * 1.7, '#fff', 12, 'right');
    if (state === 'title') return;
    text(periodShort(level), W - T, T * 1.7, '#9fd3ff', 10, 'right');

    const by = (TOP + ROWS + 1) * T;
    const show = state === 'ready' && timer > 2 ? lives : lives - 1;
    for (let i = 0; i < show && i < 6; i++) drawKid((2 + i * 2) * T, by - 2, true, 0, null, 0.75);
    levelFruits.forEach((f, i) => drawItem(f, W - (2.5 + (levelFruits.length - 1 - i) * 2) * T, by));
  }

  function drawTitle() {
    ctx.drawImage(titleBg, 0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (let i = 0; i < 70; i++) {
      const sx = ((i * 97.3) % W + Math.sin(clock * 0.8 + i) * 8 + W) % W;
      const sy = ((i * 53.7) % H + clock * (12 + (i % 5) * 6)) % H;
      ellipse(sx, sy, 0.6 + (i % 3) * 0.5, 0.6 + (i % 3) * 0.5);
    }
    text('SUMMIT YOUTH HOCKEY', W / 2, 3.6 * T, '#ffffff', 12, 'center', '#0b1640');
    text('5 HOLE', W / 2, 6.3 * T, '#ffc107', 40, 'center', '#0b1640');
    text('POND HOCKEY ATTACK', W / 2, 9.4 * T, '#bfe6ff', 16, 'center', '#0b1640');

    text('THE BIG KIDS TOOK OVER THE POND!', W / 2, 15.2 * T, '#ffffff', 8);
    text('CLEAR THE SNOW, GRAB A PUCK', W / 2, 16.3 * T, '#ffffff', 8);
    text('AND GO FIVE-HOLE ON THEM!', W / 2, 17.4 * T, '#ffc107', 8);

    text('OPPONENT / NICKNAME', W / 2 + T, 19.2 * T, '#9fd3ff', 10);
    ROSTER.forEach((pl, i) => {
      const y = (21.2 + i * 2.3) * T;
      drawPlayer({ ...pl, dir: DIRS[3], face: 1, fright: false, state: 'active', phase: i * 1.7 }, 3.5 * T, y + 2, 1.35);
      text(`-${pl.role}`, 6 * T, y, pl.color, 10, 'left');
      text(`"${pl.nick}"`, 16.5 * T, y, pl.color, 10, 'left');
    });

    const sy = 29.8 * T;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    for (let k = 0; k < 3; k++) {
      const dx = Math.cos(k * Math.PI / 3) * 2.7, dy = Math.sin(k * Math.PI / 3) * 2.7;
      ctx.moveTo(6 * T - dx, sy - dy);
      ctx.lineTo(6 * T + dx, sy + dy);
    }
    ctx.stroke();
    text('10 PTS', 7.2 * T, sy, '#fff', 10, 'left');
    drawPuck(16 * T, sy);
    text('50 PTS', 17.4 * T, sy, '#fff', 10, 'left');

    // a little chase across the pond
    const t = (clock * 0.25) % 2;
    const chaseX = t < 1 ? W + 2 * T - t * (W + 14 * T) : -12 * T + (t - 1) * (W + 14 * T);
    const toLeft = t < 1;
    const cy = 31.9 * T;
    ROSTER.forEach((pl, i) => {
      const gx = chaseX + (toLeft ? 1 : -1) * (2.4 + i * 2) * T;
      drawPlayer({ ...pl, dir: toLeft ? LEFT : DIRS[3], face: toLeft ? -1 : 1, fright: !toLeft, state: 'active', phase: i }, gx, cy);
    });
    drawKid(chaseX, cy, !toLeft, clock * 3, null, SPRITE);

    if (Math.floor(clock * 2) % 2 === 0) {
      const touch = matchMedia('(pointer: coarse)').matches;
      text(touch ? 'TAP TO DROP THE PUCK' : 'PRESS ENTER TO PLAY', W / 2, 33.6 * T, '#ffc107', 12, 'center', '#06142a');
    }
    text('ARROWS/WASD SKATE  P PAUSE  M MUTE', W / 2, 35 * T, '#9fb3c8', 8);
  }

  function render() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.fillStyle = '#06142a';
    ctx.fillRect(0, 0, W, H);
    if (state === 'title') { drawTitle(); drawHUD(); return; }
    drawHUD();

    const flashing = state === 'levelDone' && timer > 1 && Math.floor(timer * 4) % 2 === 1;
    ctx.drawImage(flashing ? mazeFlash : mazeIce, 0, TOP * T, W, ROWS * T);
    if (state !== 'levelDone') drawDots();
    if (fruit) drawItem(fruit.idx, px(14), py(17.5));

    if (pac.dir.x) pac.face = pac.dir.x;
    const kidRight = pac.face > 0;
    const showPlayers = !(state === 'gameover' || (state === 'dying' && timer >= 1) || (state === 'levelDone' && timer >= 1));
    if (showPlayers) {
      for (const g of ghosts) if (g !== eatenGhost) drawPlayer(g, px(g.x), py(g.y));
    }
    if (state === 'dying' && timer >= 1) {
      if (timer < 2.8) drawKid(px(pac.x), py(pac.y), kidRight, 0, (timer - 1) / 1.3, SPRITE);
    } else if (state !== 'gameover' && state !== 'eatPause') {
      drawKid(px(pac.x), py(pac.y), kidRight, state === 'play' ? pac.anim : 0, null, SPRITE);
    }
    for (const p of popups) {
      const x = Math.min(W - 3 * T, Math.max(3 * T, px(p.x)));  // keep call-outs on screen
      if (p.sub) {
        text(p.text, x, py(p.y) - 6, p.color, p.size, 'center', '#06142a');
        text(p.sub, x, py(p.y) + 6, '#ffffff', p.size, 'center', '#06142a');
      } else {
        text(p.text, x, py(p.y), p.color, p.size, 'center', '#06142a');
      }
    }

    if (state === 'ready') {
      text('FACE-OFF!', W / 2, py(17.5), '#ffc107', 12, 'center', '#06142a');
      const banner = timer > 2 ? "LET'S GO SUMMIT!" : periodName(level);
      text(banner, W / 2, py(11.5) - 10, '#ffffff', 8, 'center', '#06142a');
    }
    if (state === 'levelDone' && timer > 0.2) {
      text('GOAL!', W / 2, py(17.5), Math.floor(timer * 6) % 2 ? '#e53935' : '#ffc107', 16, 'center', '#06142a');
    }
    if (state === 'gameover') text('FINAL BUZZER', W / 2, py(17.5), '#e53935', 12, 'center', '#06142a');
    if (paused) {
      ctx.fillStyle = 'rgba(6,20,42,0.7)';
      ctx.fillRect(0, 0, W, H);
      text('INTERMISSION', W / 2, H / 2 - T, '#ffc107', 16);
      text('PRESS P TO RESUME', W / 2, H / 2 + T, '#fff', 8);
    }
  }

  // ---------- input ----------
  const inGame = () => state !== 'title' && state !== 'gameover';

  function startGame() {
    initAudio();
    if (state === 'title') newGame();
  }

  function togglePause() {
    if (!inGame()) return;
    paused = !paused;
  }

  addEventListener('keydown', e => {
    initAudio();
    if (e.code in KEYMAP) {
      want = DIRS[KEYMAP[e.code]];
      e.preventDefault();
    } else if (e.code === 'Enter' || e.code === 'Space') {
      e.preventDefault();
      if (paused) paused = false; else startGame();
    } else if (e.code === 'KeyP' || e.code === 'Escape') {
      togglePause();
    } else if (e.code === 'KeyM') {
      toggleMute();
    }
  });

  let touchStart = null;
  canvas.addEventListener('touchstart', e => {
    const t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener('touchend', e => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
    touchStart = null;
    e.preventDefault();
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) {
      if (paused) paused = false; else startGame();
      return;
    }
    want = Math.abs(dx) > Math.abs(dy) ? DIRS[dx > 0 ? 3 : 1] : DIRS[dy > 0 ? 2 : 0];
  }, { passive: false });
  canvas.addEventListener('click', () => { if (paused) paused = false; else startGame(); });

  pad.querySelectorAll('button').forEach(b => {
    b.addEventListener('pointerdown', e => {
      e.preventDefault();
      initAudio();
      want = DIRS[+b.dataset.d];
      if (state === 'title') startGame();
    });
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && inGame()) paused = true;
  });
  addEventListener('resize', resize);

  // ---------- main loop ----------
  resize();
  let last = performance.now(), acc = 0;
  function loop(now) {
    acc += Math.min(0.1, (now - last) / 1000);
    last = now;
    while (acc >= STEP) { update(STEP); acc -= STEP; }
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // hook for automated testing
  window.__game = {
    get state() { return state; }, get score() { return score; }, get lives() { return lives; },
    get level() { return level; }, get dotsLeft() { return dotsLeft; }, set dotsLeft(v) { dotsLeft = v; }, get grid() { return grid; },
    get pac() { return pac; }, get ghosts() { return ghosts; },
  };
})();
</script>
</body>
</html>
