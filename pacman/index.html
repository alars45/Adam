<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pac-Man Clone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none;
  }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Press Start 2P', monospace;
  }
  canvas { display: block; }
  #pad {
    display: none; margin-top: 8px;
    grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(3, 48px);
    grid-template-areas: ". u ." "l . r" ". d .";
    gap: 4px;
  }
  #pad button {
    font: inherit; font-size: 18px; color: #ffff00; background: #111;
    border: 2px solid #2121de; border-radius: 10px; touch-action: none;
  }
  #pad button:active { background: #2121de; }
  #pad .u { grid-area: u; } #pad .l { grid-area: l; } #pad .r { grid-area: r; } #pad .d { grid-area: d; }
  @media (pointer: coarse) { #pad { display: grid; } }
</style>
</head>
<body>
<canvas id="game" aria-label="Pac-Man game"></canvas>
<div id="pad">
  <button class="u" data-d="0" aria-label="Up">&#9650;</button>
  <button class="l" data-d="1" aria-label="Left">&#9664;</button>
  <button class="r" data-d="3" aria-label="Right">&#9654;</button>
  <button class="d" data-d="2" aria-label="Down">&#9660;</button>
</div>
<script>
(() => {
  'use strict';

  // ---------- constants ----------
  const T = 16, COLS = 28, ROWS = 31, TOP = 3, BOTTOM = 2;
  const W = COLS * T, H = (ROWS + TOP + BOTTOM) * T;
  const BASE = 75.75625 / 8;  // tiles per second at "100%" arcade speed
  const STEP = 1 / 60;
  const FONT = "'Press Start 2P', monospace";

  // # wall, . dot, o power pellet, - ghost house door, space empty
  const MAZE = [
    '############################',
    '#............##............#',
    '#.####.#####.##.#####.####.#',
    '#o####.#####.##.#####.####o#',
    '#.####.#####.##.#####.####.#',
    '#..........................#',
    '#.####.##.########.##.####.#',
    '#.####.##.########.##.####.#',
    '#......##....##....##......#',
    '######.##### ## #####.######',
    '     #.##### ## #####.#     ',
    '     #.##          ##.#     ',
    '     #.## ###--### ##.#     ',
    '######.## #      # ##.######',
    '      .   #      #   .      ',
    '######.## #      # ##.######',
    '     #.## ######## ##.#     ',
    '     #.##          ##.#     ',
    '     #.## ######## ##.#     ',
    '######.## ######## ##.######',
    '#............##............#',
    '#.####.#####.##.#####.####.#',
    '#.####.#####.##.#####.####.#',
    '#o..##.......  .......##..o#',
    '###.##.##.########.##.##.###',
    '###.##.##.########.##.##.###',
    '#......##....##....##......#',
    '#.##########.##.##########.#',
    '#.##########.##.##########.#',
    '#..........................#',
    '############################',
  ];

  // Order matters: it is the arcade's tie-break order for ghost decisions.
  const DIRS = [{ x: 0, y: -1 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 1, y: 0 }];
  const UP = DIRS[0], LEFT = DIRS[1], DOWN = DIRS[2];
  const KEYMAP = {
    ArrowUp: 0, KeyW: 0, ArrowLeft: 1, KeyA: 1, ArrowDown: 2, KeyS: 2, ArrowRight: 3, KeyD: 3,
  };
  const opposite = d => DIRS.find(o => o.x === -d.x && o.y === -d.y);

  const FRUITS = [
    { name: 'cherry', pts: 100 }, { name: 'strawberry', pts: 300 }, { name: 'orange', pts: 500 },
    { name: 'apple', pts: 700 }, { name: 'melon', pts: 1000 }, { name: 'galaxian', pts: 2000 },
    { name: 'bell', pts: 3000 }, { name: 'key', pts: 5000 },
  ];
  const fruitIndex = L => L <= 2 ? L - 1 : L >= 13 ? 7 : Math.floor((L + 1) / 2);

  // Difficulty table modelled on the arcade's per-level settings.
  function levelSpec(L) {
    const tier = L === 1 ? 0 : L <= 4 ? 1 : 2;
    return {
      pac: L >= 21 ? 0.9 : [0.8, 0.9, 1][tier],
      pacFright: [0.9, 0.95, 1][tier],
      ghost: [0.75, 0.85, 0.95][tier],
      ghostFright: [0.5, 0.55, 0.6][tier],
      tunnel: [0.4, 0.45, 0.5][tier],
      elroy1: [0.8, 0.9, 1][tier],
      elroy2: [0.85, 0.95, 1.05][tier],
      elroyDots: [20, 30, 40, 40, 40, 50, 50, 50, 60, 60, 60, 80, 80, 80, 100, 100, 100, 100][L - 1] ?? 120,
      fright: [6, 5, 4, 3, 2, 5, 2, 2, 1, 5, 2, 1, 1, 3, 1, 1, 0, 1][L - 1] ?? 0,
      flashes: [5, 5, 5, 5, 5, 5, 5, 5, 3, 5, 5, 3, 3, 5, 3, 3, 0, 3][L - 1] ?? 0,
      // alternating scatter / chase durations (seconds); chase forever afterwards
      modes: [[7, 20, 7, 20, 5, 20, 5], [7, 20, 7, 20, 5, 1033, 1 / 60], [5, 20, 5, 20, 5, 1037, 1 / 60]][tier],
      // cumulative dots before each ghost (blinky, pinky, inky, clyde) leaves the house
      release: L === 1 ? [0, 0, 30, 90] : L === 2 ? [0, 0, 0, 50] : [0, 0, 0, 0],
      idle: L >= 5 ? 3 : 4,
      fruit: fruitIndex(L),
    };
  }

  // ---------- canvas ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const pad = document.getElementById('pad');
  let scale = 1, mazeBlue, mazeWhite;

  function resize() {
    const padH = getComputedStyle(pad).display === 'none' ? 0 : pad.offsetHeight + 8;
    const fit = Math.max(0.3, Math.min(innerWidth / W, (innerHeight - padH) / H));
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = Math.floor(W * fit) + 'px';
    canvas.style.height = Math.floor(H * fit) + 'px';
    scale = fit * dpr;
    canvas.width = Math.round(W * scale);
    canvas.height = Math.round(H * scale);
    mazeBlue = renderMaze('#2121de');
    mazeWhite = renderMaze('#ffffff');
  }

  // Pre-render the maze walls as double-line outlines.
  function renderMaze(color) {
    const cv = document.createElement('canvas');
    cv.width = Math.round(W * scale);
    cv.height = Math.round(ROWS * T * scale);
    const g = cv.getContext('2d');
    g.scale(scale, scale);
    const wall = (c, r) => r >= 0 && r < ROWS && c >= 0 && c < COLS && MAZE[r][c] === '#';
    const O = 3, I = 5;  // outer and inner inset: the line is the gap between them
    const fill = (inset, col) => {
      g.fillStyle = col;
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
        if (!wall(c, r)) continue;
        // overlap neighbouring wall tiles slightly so no seams show when scaled
        const l = wall(c - 1, r) ? -0.5 : inset, rt = wall(c + 1, r) ? -0.5 : inset;
        const tp = wall(c, r - 1) ? -0.5 : inset, bt = wall(c, r + 1) ? -0.5 : inset;
        g.fillRect(c * T + l, r * T + tp, T - l - rt, T - tp - bt);
      }
    };
    fill(O, color);
    fill(I, '#000');
    // join the lines around concave corners
    g.fillStyle = color;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (!wall(c, r)) continue;
      for (const dx of [-1, 1]) for (const dy of [-1, 1]) {
        if (!wall(c + dx, r) || !wall(c, r + dy) || wall(c + dx, r + dy)) continue;
        const x = c * T, y = r * T;
        g.fillRect(dx > 0 ? x + T - I : x, dy > 0 ? y + T - I : y + O, I, I - O);
        g.fillRect(dx > 0 ? x + T - I : x + O, dy > 0 ? y + T - I : y, I - O, I);
      }
    }
    g.fillStyle = '#ffb8ff';
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (MAZE[r][c] === '-') g.fillRect(c * T, r * T + T / 2 - 1, T, 3);
    }
    return cv;
  }

  // ---------- audio ----------
  let ac = null, master = null, siren = null, sirenGain = null, muted = false, wakaFlip = false, sirenPhase = 0;

  function initAudio() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return; }
    master = ac.createGain();
    master.gain.value = muted ? 0 : 0.5;
    master.connect(ac.destination);
    siren = ac.createOscillator();
    siren.type = 'triangle';
    sirenGain = ac.createGain();
    sirenGain.gain.value = 0;
    siren.connect(sirenGain).connect(master);
    siren.start();
  }

  function tone(freq, dur, { type = 'square', vol = 0.08, to = null, at = 0 } = {}) {
    if (!ac) return;
    const t0 = ac.currentTime + at;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(master);
    o.start(t0);
    o.stop(t0 + dur + 0.02);
  }

  const sfx = {
    waka() {
      wakaFlip = !wakaFlip;
      tone(wakaFlip ? 230 : 460, 0.09, { type: 'triangle', vol: 0.2, to: wakaFlip ? 460 : 230 });
    },
    power() { tone(120, 0.3, { vol: 0.06, to: 480 }); },
    ghost() { tone(160, 0.4, { vol: 0.07, to: 1500 }); },
    fruit() { tone(520, 0.1, { to: 1040 }); tone(780, 0.16, { to: 1560, at: 0.1 }); },
    extra() { for (let i = 0; i < 4; i++) tone(1320, 0.1, { vol: 0.06, at: i * 0.15 }); },
    death() {
      for (let i = 0; i < 9; i++) tone(820 - i * 60, 0.13, { vol: 0.07, to: 520 - i * 45, at: i * 0.13 });
      tone(180, 0.12, { vol: 0.08, to: 900, at: 1.25 });
      tone(180, 0.12, { vol: 0.08, to: 900, at: 1.42 });
    },
    intro() {
      // an original little start-up jingle
      const notes = [
        [523, 0], [659, .15], [784, .3], [1047, .45], [784, .75], [1047, .9],
        [587, 1.2], [740, 1.35], [880, 1.5], [1175, 1.65], [880, 1.95], [1175, 2.1],
        [659, 2.4], [784, 2.55], [988, 2.7], [1319, 2.85], [1175, 3.15], [1319, 3.3], [1568, 3.5],
      ];
      for (const [f, at] of notes) tone(f, 0.14, { vol: 0.05, at });
      const bass = [[131, 0], [196, .6], [147, 1.2], [220, 1.8], [165, 2.4], [247, 3.0], [262, 3.5]];
      for (const [f, at] of bass) tone(f, 0.4, { type: 'triangle', vol: 0.15, at });
    },
  };

  function updateSiren(dt) {
    if (!ac) return;
    let f = 300, vol = 0;
    if (state === 'play' && !paused) {
      sirenPhase += dt;
      if (ghosts.some(g => g.state === 'eaten' || g.state === 'entering')) {
        f = 700 + 500 * ((sirenPhase * 7) % 1); vol = 0.035;
      } else if (frightTime > 0) {
        f = 190 + 160 * ((sirenPhase * 9) % 1); vol = 0.035;
      } else {
        const stage = Math.min(4, Math.floor((1 - dotsLeft / dotsTotal) * 5));
        const tri = Math.abs(((sirenPhase * (2.2 + stage * 0.5)) % 1) * 2 - 1);
        f = 340 + stage * 60 + 260 * tri; vol = 0.025;
      }
    }
    const now = ac.currentTime;
    siren.frequency.setTargetAtTime(f, now, 0.01);
    sirenGain.gain.setTargetAtTime(vol, now, 0.03);
  }

  function toggleMute() {
    muted = !muted;
    if (master) master.gain.setTargetAtTime(muted ? 0 : 0.5, ac.currentTime, 0.01);
  }

  // ---------- game state ----------
  let state = 'title', timer = 0, paused = false, clock = 0;
  let grid, dotsLeft, dotsTotal, score = 0, lives = 0, level = 1, extraGiven = false;
  let hi = 0;
  try { hi = +localStorage.getItem('pacman-clone-hi') || 0; } catch {}
  let spec, pac, ghosts = [], want = null;
  let modeIdx, modeTime, frightTime, eatCount, dotCounter, idleTime, deathRelease;
  let fruit = null, levelFruits = [], popups = [], eatenGhost = null, deathSfxPlayed = false;

  function saveHi() {
    try { localStorage.setItem('pacman-clone-hi', String(hi)); } catch {}
  }

  function tileAt(c, r) {
    if (r < 0 || r >= ROWS) return '#';
    return grid[r][(c + COLS) % COLS];
  }
  const pacOpen = (c, r) => { const t = tileAt(c, r); return t !== '#' && t !== '-'; };
  const ghostOpen = pacOpen;

  function makeGhost(name, color, x, y, st, scatter) {
    return { name, color, x, y, state: st, dir: st === 'active' ? LEFT : UP, scatter, fright: false, bob: -1 };
  }

  function resetActors() {
    pac = { x: 14, y: 23.5, dir: LEFT, moving: true, stall: 0, anim: 0 };
    ghosts = [
      makeGhost('blinky', '#ff0000', 14, 11.5, 'active', { x: 25, y: -3 }),
      makeGhost('pinky', '#ffb8ff', 14, 14.5, 'house', { x: 2, y: -3 }),
      makeGhost('inky', '#00ffff', 12, 14.5, 'house', { x: 27, y: 31 }),
      makeGhost('clyde', '#ffb852', 16, 14.5, 'house', { x: 0, y: 31 }),
    ];
    ghosts[2].bob = 1;
    ghosts[3].bob = 1;
    want = null;
    modeIdx = 0; modeTime = 0; frightTime = 0; eatCount = 0;
    dotCounter = 0; idleTime = 0;
    fruit = null; eatenGhost = null;
  }

  function startLevel(first) {
    spec = levelSpec(level);
    grid = MAZE.map(r => r.split(''));
    dotsTotal = dotsLeft = MAZE.join('').split('').filter(c => c === '.' || c === 'o').length;
    resetActors();
    deathRelease = false;
    levelFruits.push(spec.fruit);
    if (levelFruits.length > 7) levelFruits.shift();
    state = 'ready';
    timer = first ? 4.2 : 2;
    if (first) sfx.intro();
  }

  function newGame() {
    score = 0; lives = 3; level = 1; extraGiven = false;
    levelFruits = []; popups = []; paused = false;
    startLevel(true);
  }

  function addScore(n) {
    score += n;
    if (!extraGiven && score >= 10000) { extraGiven = true; lives++; sfx.extra(); }
    if (score > hi) hi = score;
  }

  // ---------- movement ----------
  // Moves an entity along its direction, calling onCenter whenever it sits
  // exactly on a tile centre so it can turn or stop.
  function advance(e, dist, onCenter) {
    for (let guard = 0; dist > 1e-7 && guard < 8; guard++) {
      const cx = Math.floor(e.x) + 0.5, cy = Math.floor(e.y) + 0.5;
      if (Math.abs(e.x - cx) < 1e-6 && Math.abs(e.y - cy) < 1e-6) {
        e.x = cx; e.y = cy;
        if (onCenter(e) === false) return;
      }
      const d = e.dir;
      const ahead = (cx - e.x) * d.x + (cy - e.y) * d.y;
      const tx = ahead > 1e-6 ? cx : cx + d.x, ty = ahead > 1e-6 ? cy : cy + d.y;
      const rem = Math.abs(tx - e.x) + Math.abs(ty - e.y);
      const step = Math.min(dist, rem);
      e.x += d.x * step; e.y += d.y * step;
      dist -= step;
      if (step === rem) { e.x = tx; e.y = ty; }
      if (e.x < 0) e.x += COLS; else if (e.x >= COLS) e.x -= COLS;
    }
  }

  function pacAtCenter(p) {
    const c = Math.floor(p.x), r = Math.floor(p.y);
    if (want && pacOpen(c + want.x, r + want.y)) p.dir = want;
    if (!pacOpen(c + p.dir.x, r + p.dir.y)) { p.moving = false; return false; }
  }

  function movePac(dt) {
    if (pac.stall > 0) { pac.stall -= dt; return; }
    if (want && want === opposite(pac.dir)) { pac.dir = want; pac.moving = true; }
    if (!pac.moving) {
      const c = Math.floor(pac.x), r = Math.floor(pac.y);
      if (want && pacOpen(c + want.x, r + want.y)) { pac.dir = want; pac.moving = true; }
      else return;
    }
    const dist = BASE * (frightTime > 0 ? spec.pacFright : spec.pac) * dt;
    advance(pac, dist, pacAtCenter);
    if (pac.moving) pac.anim += dist;
    eatTile();
  }

  function eatTile() {
    const c = Math.floor(pac.x), r = Math.floor(pac.y);
    const t = grid[r][c];
    if (t !== '.' && t !== 'o') return;
    grid[r][c] = ' ';
    dotsLeft--;
    dotCounter++;
    idleTime = 0;
    sfx.waka();
    if (t === '.') { addScore(10); pac.stall = 1 / 60; }
    else { addScore(50); pac.stall = 3 / 60; powerUp(); }
    const eaten = dotsTotal - dotsLeft;
    if (eaten === 70 || eaten === 170) fruit = { t: 9 + Math.random(), idx: spec.fruit };
  }

  function powerUp() {
    eatCount = 0;
    for (const g of ghosts) {
      if (g.state === 'active') g.dir = opposite(g.dir);
      if (g.state !== 'eaten' && g.state !== 'entering') g.fright = spec.fright > 0;
    }
    if (spec.fright > 0) { frightTime = spec.fright; sfx.power(); }
  }

  const elroy = () => dotsLeft <= spec.elroyDots / 2 ? 2 : dotsLeft <= spec.elroyDots ? 1 : 0;
  const isChase = () => modeIdx % 2 === 1;

  function ghostSpeed(g) {
    if (g.state === 'eaten' || g.state === 'entering') return BASE * 1.6;
    if (g.state === 'house' || g.state === 'leaving') return BASE * 0.5;
    const c = Math.floor(g.x), r = Math.floor(g.y);
    if (r === 14 && (c < 6 || c > 21)) return BASE * spec.tunnel;
    if (g.fright) return BASE * spec.ghostFright;
    if (g.name === 'blinky') {
      const e = elroy();
      if (e === 2) return BASE * spec.elroy2;
      if (e === 1) return BASE * spec.elroy1;
    }
    return BASE * spec.ghost;
  }

  function ghostTarget(g) {
    if (g.state === 'eaten') return { x: 13, y: 11 };
    const pc = Math.floor(pac.x), pr = Math.floor(pac.y), d = pac.dir;
    const cruise = g.name === 'blinky' && elroy() > 0;
    if (!isChase() && !cruise) return g.scatter;
    switch (g.name) {
      case 'blinky': return { x: pc, y: pr };
      case 'pinky':  // includes the arcade's "up also shifts left" quirk
        return { x: pc + d.x * 4 - (d === UP ? 4 : 0), y: pr + d.y * 4 };
      case 'inky': {
        const b = ghosts[0];
        const vx = pc + d.x * 2 - (d === UP ? 2 : 0), vy = pr + d.y * 2;
        return { x: 2 * vx - Math.floor(b.x), y: 2 * vy - Math.floor(b.y) };
      }
      default: {
        const dx = Math.floor(g.x) - pc, dy = Math.floor(g.y) - pr;
        return dx * dx + dy * dy > 64 ? { x: pc, y: pr } : g.scatter;
      }
    }
  }

  function ghostAtCenter(g) {
    const c = Math.floor(g.x), r = Math.floor(g.y);
    if (g.state === 'eaten' && r === 11 && (c === 13 || c === 14)) { g.state = 'entering'; return false; }
    const back = opposite(g.dir);
    const opts = DIRS.filter(d => d !== back && ghostOpen(c + d.x, r + d.y));
    if (!opts.length) { g.dir = back; return; }
    if (g.fright) { g.dir = opts[Math.floor(Math.random() * opts.length)]; return; }
    const t = ghostTarget(g);
    let best = opts[0], bestD = Infinity;
    for (const d of opts) {
      const dx = c + d.x - t.x, dy = r + d.y - t.y, dd = dx * dx + dy * dy;
      if (dd < bestD) { bestD = dd; best = d; }
    }
    g.dir = best;
  }

  // Slides a ghost toward the house column, then vertically to ty.
  function houseMove(g, sp, ty) {
    if (Math.abs(g.x - 14) > 1e-6) {
      const s = Math.sign(14 - g.x);
      g.x += s * Math.min(sp, Math.abs(14 - g.x));
      g.dir = s < 0 ? LEFT : DIRS[3];
      return false;
    }
    if (Math.abs(g.y - ty) > 1e-6) {
      const s = Math.sign(ty - g.y);
      g.y += s * Math.min(sp, Math.abs(ty - g.y));
      g.dir = s < 0 ? UP : DOWN;
      return false;
    }
    return true;
  }

  function moveGhost(g, dt) {
    const sp = ghostSpeed(g) * dt;
    switch (g.state) {
      case 'house':
        g.y += g.bob * sp;
        if (g.y < 14) { g.y = 14; g.bob = 1; } else if (g.y > 15) { g.y = 15; g.bob = -1; }
        g.dir = g.bob < 0 ? UP : DOWN;
        break;
      case 'leaving':
        if (houseMove(g, sp, 11.5)) { g.state = 'active'; g.dir = LEFT; }
        break;
      case 'entering':
        if (houseMove(g, sp, 14.5)) { g.state = 'leaving'; g.fright = false; }
        break;
      default:
        advance(g, sp, ghostAtCenter);
    }
  }

  function releaseGhosts(dt) {
    const limits = deathRelease ? [0, 7, 17, 32] : spec.release;
    const next = ghosts.find(g => g.state === 'house');
    if (!next) return;
    idleTime += dt;
    if (dotCounter >= limits[ghosts.indexOf(next)] || idleTime >= spec.idle) {
      next.state = 'leaving';
      idleTime = 0;
    }
  }

  function wrapDist(a, b) {
    let dx = Math.abs(a.x - b.x);
    dx = Math.min(dx, COLS - dx);
    return Math.hypot(dx, a.y - b.y);
  }

  function checkCollisions() {
    for (const g of ghosts) {
      if (g.state !== 'active' || wrapDist(pac, g) > 0.5) continue;
      if (g.fright) {
        g.fright = false;
        g.state = 'eaten';
        eatCount++;
        const pts = 200 * 2 ** (eatCount - 1);
        addScore(pts);
        popups.push({ x: g.x, y: g.y, text: String(pts), color: '#00ffff', t: 1, size: 8 });
        eatenGhost = g;
        state = 'eatPause';
        timer = 1;
        sfx.ghost();
      } else {
        state = 'dying';
        timer = 0;
        deathSfxPlayed = false;
      }
      return;
    }
  }

  function stepPlay(dt) {
    if (frightTime > 0) {
      frightTime -= dt;
      if (frightTime <= 0) { frightTime = 0; for (const g of ghosts) g.fright = false; }
    } else if (modeIdx < spec.modes.length) {
      modeTime += dt;
      if (modeTime >= spec.modes[modeIdx]) {
        modeTime = 0;
        modeIdx++;
        for (const g of ghosts) if (g.state === 'active') g.dir = opposite(g.dir);
      }
    }
    releaseGhosts(dt);
    movePac(dt);
    checkCollisions();
    if (state !== 'play') return;
    for (const g of ghosts) moveGhost(g, dt);
    checkCollisions();
    if (state !== 'play') return;

    if (fruit) {
      fruit.t -= dt;
      if (fruit.t <= 0) fruit = null;
      else if (wrapDist(pac, { x: 14, y: 17.5 }) < 0.7) {
        const pts = FRUITS[fruit.idx].pts;
        addScore(pts);
        popups.push({ x: 14, y: 17.5, text: String(pts), color: '#ffb8ff', t: 2, size: 8 });
        fruit = null;
        sfx.fruit();
      }
    }
    if (dotsLeft === 0) { state = 'levelDone'; timer = 0; fruit = null; }
  }

  function update(dt) {
    if (paused) { updateSiren(dt); return; }
    clock += dt;
    for (const p of popups) p.t -= dt;
    popups = popups.filter(p => p.t > 0);

    switch (state) {
      case 'ready':
        timer -= dt;
        if (timer <= 0) state = 'play';
        break;
      case 'play':
        stepPlay(dt);
        break;
      case 'eatPause':
        timer -= dt;
        if (timer <= 0) { state = 'play'; eatenGhost = null; }
        break;
      case 'dying':
        timer += dt;
        if (timer >= 1 && !deathSfxPlayed) { deathSfxPlayed = true; sfx.death(); }
        if (timer >= 3) {
          lives--;
          if (lives <= 0) { state = 'gameover'; timer = 4; saveHi(); }
          else { resetActors(); deathRelease = true; state = 'ready'; timer = 2; }
        }
        break;
      case 'levelDone':
        timer += dt;
        if (timer >= 3.2) { level++; saveHi(); startLevel(false); }
        break;
      case 'gameover':
        timer -= dt;
        if (timer <= 0) state = 'title';
        break;
    }
    updateSiren(dt);
  }

  // ---------- drawing ----------
  const px = x => x * T;
  const py = y => (y + TOP) * T;

  function text(str, x, y, color, size = 8, align = 'center') {
    ctx.font = `${size}px ${FONT}`;
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.fillText(str, x, y);
  }

  function drawPac(x, y, dir, anim, death = null) {
    const R = T * 0.8;
    ctx.fillStyle = '#ffff00';
    if (death !== null) {
      if (death >= 1) {
        ctx.strokeStyle = '#ffff00';
        ctx.lineWidth = 2;
        const k = Math.min(1, (death - 1) * 4);
        for (let i = 0; i < 8; i++) {
          const a = i * Math.PI / 4;
          ctx.beginPath();
          ctx.moveTo(x + Math.cos(a) * R * 0.4 * (1 + k), y + Math.sin(a) * R * 0.4 * (1 + k));
          ctx.lineTo(x + Math.cos(a) * R * (0.8 + k * 0.3), y + Math.sin(a) * R * (0.8 + k * 0.3));
          ctx.stroke();
        }
        return;
      }
      const open = 0.1 + death * (Math.PI - 0.1);
      const ang = -Math.PI / 2;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.arc(x, y, R, ang + open, ang + 2 * Math.PI - open);
      ctx.closePath();
      ctx.fill();
      return;
    }
    const open = 0.04 + 0.8 * Math.abs(Math.sin(anim * Math.PI * 1.6));
    const ang = Math.atan2(dir.y, dir.x);
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.arc(x, y, R, ang + open, ang + 2 * Math.PI - open);
    ctx.closePath();
    ctx.fill();
  }

  function drawGhost(g, x, y, look = g.dir) {
    const R = T * 0.82;
    const fright = g.fright && g.state !== 'eaten' && g.state !== 'entering';
    const flashWindow = spec ? spec.flashes * 0.4 : 0;
    const white = fright && inGame() && frightTime < flashWindow && Math.floor(frightTime / 0.2) % 2 === 0;
    if (g.state !== 'eaten' && g.state !== 'entering') {
      ctx.fillStyle = fright ? (white ? '#ffffff' : '#2121ff') : g.color;
      ctx.beginPath();
      ctx.arc(x, y - R * 0.15, R, Math.PI, 0);
      const bottom = y + R * 0.9;
      const phase = Math.floor(clock * 8) % 2;
      const n = 6;
      for (let i = 0; i <= n; i++) {
        const sx = x + R - (2 * R) * i / n;
        ctx.lineTo(sx, (i + phase) % 2 === 0 ? bottom : bottom - R * 0.32);
      }
      ctx.closePath();
      ctx.fill();
    }
    if (fright) {
      const face = white ? '#ff0000' : '#ffb8ae';
      ctx.fillStyle = face;
      ctx.fillRect(x - R * 0.45, y - R * 0.38, R * 0.25, R * 0.25);
      ctx.fillRect(x + R * 0.2, y - R * 0.38, R * 0.25, R * 0.25);
      ctx.strokeStyle = face;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let i = 0; i <= 6; i++) {
        const mx = x - R * 0.65 + (R * 1.3) * i / 6;
        const my = y + R * 0.3 + (i % 2 ? -R * 0.15 : 0);
        i ? ctx.lineTo(mx, my) : ctx.moveTo(mx, my);
      }
      ctx.stroke();
      return;
    }
    for (const s of [-1, 1]) {
      const ex = x + s * R * 0.38 + look.x * R * 0.1, ey = y - R * 0.25 + look.y * R * 0.12;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.ellipse(ex, ey, R * 0.28, R * 0.36, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#2121ff';
      ctx.beginPath();
      ctx.arc(ex + look.x * R * 0.15, ey + look.y * R * 0.18, R * 0.16, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawFruit(idx, x, y) {
    const R = T * 0.7;
    const circle = (cx, cy, r, col) => { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill(); };
    ctx.lineWidth = 1.5;
    switch (FRUITS[idx].name) {
      case 'cherry':
        ctx.strokeStyle = '#de9751';
        ctx.beginPath();
        ctx.moveTo(x - R * 0.45, y + R * 0.2); ctx.quadraticCurveTo(x, y - R * 0.4, x + R * 0.6, y - R * 0.8);
        ctx.moveTo(x + R * 0.35, y + R * 0.35); ctx.quadraticCurveTo(x + R * 0.4, y - R * 0.3, x + R * 0.6, y - R * 0.8);
        ctx.stroke();
        circle(x - R * 0.45, y + R * 0.35, R * 0.38, '#ff0000');
        circle(x + R * 0.3, y + R * 0.5, R * 0.38, '#ff0000');
        circle(x - R * 0.55, y + R * 0.25, R * 0.1, '#fff');
        break;
      case 'strawberry':
        ctx.fillStyle = '#ff0000';
        ctx.beginPath();
        ctx.moveTo(x - R * 0.8, y - R * 0.3);
        ctx.quadraticCurveTo(x, y - R * 0.7, x + R * 0.8, y - R * 0.3);
        ctx.quadraticCurveTo(x + R * 0.6, y + R * 0.6, x, y + R * 0.9);
        ctx.quadraticCurveTo(x - R * 0.6, y + R * 0.6, x - R * 0.8, y - R * 0.3);
        ctx.fill();
        ctx.fillStyle = '#fff';
        for (const [sx, sy] of [[-.4, 0], [.1, -.1], [.4, .1], [-.15, .35], [.2, .5]]) ctx.fillRect(x + sx * R, y + sy * R, 1.5, 1.5);
        ctx.fillStyle = '#00de00';
        ctx.fillRect(x - R * 0.5, y - R * 0.7, R, R * 0.25);
        break;
      case 'orange':
        circle(x, y + R * 0.1, R * 0.75, '#ffb852');
        ctx.fillStyle = '#00de00';
        ctx.fillRect(x - R * 0.05, y - R * 0.85, R * 0.5, R * 0.25);
        break;
      case 'apple':
        circle(x, y + R * 0.1, R * 0.75, '#ff0000');
        circle(x - R * 0.3, y - R * 0.1, R * 0.12, '#fff');
        ctx.strokeStyle = '#de9751';
        ctx.beginPath(); ctx.moveTo(x, y - R * 0.5); ctx.lineTo(x + R * 0.1, y - R * 0.9); ctx.stroke();
        break;
      case 'melon':
        circle(x, y + R * 0.1, R * 0.75, '#00de00');
        ctx.strokeStyle = '#006400';
        for (const s of [-0.35, 0, 0.35]) {
          ctx.beginPath(); ctx.moveTo(x + s * R, y - R * 0.55); ctx.lineTo(x + s * R, y + R * 0.75); ctx.stroke();
        }
        break;
      case 'galaxian':
        ctx.fillStyle = '#ffff00';
        ctx.beginPath();
        ctx.moveTo(x, y + R * 0.8); ctx.lineTo(x - R * 0.9, y - R * 0.3); ctx.lineTo(x + R * 0.9, y - R * 0.3);
        ctx.fill();
        ctx.fillStyle = '#2121ff';
        ctx.fillRect(x - R * 0.9, y - R * 0.8, R * 0.3, R * 0.6);
        ctx.fillRect(x + R * 0.6, y - R * 0.8, R * 0.3, R * 0.6);
        ctx.fillStyle = '#ff0000';
        ctx.fillRect(x - R * 0.15, y - R * 0.9, R * 0.3, R * 0.7);
        break;
      case 'bell':
        ctx.fillStyle = '#ffff00';
        ctx.beginPath();
        ctx.moveTo(x - R * 0.8, y + R * 0.6);
        ctx.quadraticCurveTo(x - R * 0.6, y - R * 0.9, x, y - R * 0.85);
        ctx.quadraticCurveTo(x + R * 0.6, y - R * 0.9, x + R * 0.8, y + R * 0.6);
        ctx.fill();
        circle(x, y + R * 0.7, R * 0.2, '#00ffff');
        break;
      default:  // key
        ctx.fillStyle = '#00ffff';
        ctx.fillRect(x - R * 0.45, y - R * 0.9, R * 0.9, R * 0.55);
        ctx.fillStyle = '#000';
        ctx.fillRect(x - R * 0.2, y - R * 0.75, R * 0.4, R * 0.15);
        ctx.fillStyle = '#fff';
        ctx.fillRect(x - R * 0.1, y - R * 0.35, R * 0.2, R * 1.2);
        ctx.fillRect(x + R * 0.1, y + R * 0.4, R * 0.25, R * 0.12);
        ctx.fillRect(x + R * 0.1, y + R * 0.65, R * 0.2, R * 0.12);
    }
  }

  function drawDots() {
    const blinkOn = state !== 'play' || Math.floor(clock * 5) % 2 === 0;
    ctx.fillStyle = '#ffb8ae';
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const t = grid[r][c];
      if (t === '.') ctx.fillRect(c * T + T / 2 - 2, (r + TOP) * T + T / 2 - 2, 4, 4);
      else if (t === 'o' && blinkOn) {
        ctx.beginPath();
        ctx.arc(c * T + T / 2, (r + TOP) * T + T / 2, T * 0.42, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawHUD() {
    const blink = state === 'title' || Math.floor(clock * 3) % 2 === 0;
    if (blink) text('1UP', 3 * T, T * 0.6, '#fff', 12, 'left');
    text(String(score).padStart(2, '0'), 7 * T, T * 1.7, '#fff', 12, 'right');
    text('HIGH SCORE', W / 2, T * 0.6, '#fff', 12);
    text(String(hi).padStart(2, '0'), W / 2 + 3 * T, T * 1.7, '#fff', 12, 'right');
    if (state === 'title') return;
    text(`LV ${level}`, W - T, T * 1.7, '#888', 10, 'right');

    const by = (TOP + ROWS + 1) * T;
    const show = state === 'ready' && timer > 2 ? lives : lives - 1;
    for (let i = 0; i < show && i < 6; i++) drawPac((2.5 + i * 2) * T, by, LEFT, 0.25);
    levelFruits.forEach((f, i) => drawFruit(f, W - (2.5 + (levelFruits.length - 1 - i) * 2) * T, by));
  }

  function drawTitle() {
    text('PAC-MAN', W / 2, 5 * T, '#ffff00', 32);
    text('CLONE', W / 2, 7.3 * T, '#ffb852', 12);
    text('CHARACTER / NICKNAME', W / 2 + T, 10 * T, '#fff', 10);
    const cast = [
      ['SHADOW', 'BLINKY', '#ff0000'], ['SPEEDY', 'PINKY', '#ffb8ff'],
      ['BASHFUL', 'INKY', '#00ffff'], ['POKEY', 'CLYDE', '#ffb852'],
    ];
    cast.forEach(([role, nick, color], i) => {
      const y = (12.5 + i * 2.5) * T;
      drawGhost({ color, dir: DIRS[3], fright: false, state: 'active' }, 4 * T, y);
      text(`-${role}`, 6.5 * T, y, color, 10, 'left');
      text(`"${nick}"`, 18 * T, y, color, 10, 'left');
    });

    ctx.fillStyle = '#ffb8ae';
    ctx.fillRect(11 * T - 2, 23.5 * T - 2, 4, 4);
    text('10 PTS', 12.5 * T, 23.5 * T, '#fff', 10, 'left');
    ctx.fillStyle = '#ffb8ae';
    ctx.beginPath(); ctx.arc(11 * T, 25.5 * T, T * 0.42, 0, Math.PI * 2); ctx.fill();
    text('50 PTS', 12.5 * T, 25.5 * T, '#fff', 10, 'left');

    // a little chase across the screen
    const t = (clock * 0.25) % 2;
    const chaseX = t < 1 ? W + 2 * T - t * (W + 14 * T) : -12 * T + (t - 1) * (W + 14 * T);
    const toLeft = t < 1;
    const cy = 28.5 * T;
    drawPac(chaseX, cy, toLeft ? LEFT : DIRS[3], clock * 6);
    cast.forEach(([, , color], i) => {
      const gx = chaseX + (toLeft ? 1 : -1) * (2.2 + i * 1.8) * T;
      drawGhost({ color, dir: toLeft ? LEFT : DIRS[3], fright: !toLeft, state: 'active' }, gx, cy);
    });

    if (Math.floor(clock * 2) % 2 === 0) {
      const touch = matchMedia('(pointer: coarse)').matches;
      text(touch ? 'TAP TO START' : 'PRESS ENTER TO START', W / 2, 31.5 * T, '#ffff00', 12);
    }
    text('ARROWS/WASD MOVE  P PAUSE  M MUTE', W / 2, 33.5 * T, '#888', 8);
  }

  function render() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    drawHUD();
    if (state === 'title') { drawTitle(); return; }

    const flashing = state === 'levelDone' && timer > 1 && Math.floor(timer * 4) % 2 === 1;
    ctx.drawImage(flashing ? mazeWhite : mazeBlue, 0, TOP * T, W, ROWS * T);
    if (state !== 'levelDone') drawDots();
    if (fruit) drawFruit(fruit.idx, px(14), py(17.5));

    const showGhosts = !(state === 'gameover' || (state === 'dying' && timer >= 1) || (state === 'levelDone' && timer >= 1));
    if (state === 'dying' && timer >= 1) {
      if (timer < 2.8) drawPac(px(pac.x), py(pac.y), pac.dir, 0, Math.min(1.25, (timer - 1) / 1.3));
    } else if (state !== 'gameover' && state !== 'eatPause') {
      const anim = state === 'levelDone' ? 0 : pac.anim;
      drawPac(px(pac.x), py(pac.y), pac.dir, state === 'ready' ? 0.3 : anim);
    }
    if (showGhosts) {
      for (const g of ghosts) if (g !== eatenGhost) drawGhost(g, px(g.x), py(g.y));
    }
    for (const p of popups) text(p.text, px(p.x), py(p.y), p.color, p.size);

    if (state === 'ready') text('READY!', W / 2, py(17.5), '#ffff00', 12);
    if (state === 'gameover') text('GAME  OVER', W / 2, py(17.5), '#ff0000', 12);
    if (state === 'ready' && timer > 2) text('PLAYER ONE', W / 2, py(11.5), '#00ffff', 12);
    if (paused) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, 0, W, H);
      text('PAUSED', W / 2, H / 2 - T, '#ffff00', 16);
      text('PRESS P TO RESUME', W / 2, H / 2 + T, '#fff', 8);
    }
  }

  // ---------- input ----------
  const inGame = () => state !== 'title' && state !== 'gameover';

  function startGame() {
    initAudio();
    if (state === 'title') newGame();
  }

  function togglePause() {
    if (!inGame()) return;
    paused = !paused;
  }

  addEventListener('keydown', e => {
    initAudio();
    if (e.code in KEYMAP) {
      want = DIRS[KEYMAP[e.code]];
      e.preventDefault();
    } else if (e.code === 'Enter' || e.code === 'Space') {
      e.preventDefault();
      if (paused) paused = false; else startGame();
    } else if (e.code === 'KeyP' || e.code === 'Escape') {
      togglePause();
    } else if (e.code === 'KeyM') {
      toggleMute();
    }
  });

  let touchStart = null;
  canvas.addEventListener('touchstart', e => {
    const t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener('touchend', e => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
    touchStart = null;
    e.preventDefault();
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) {
      if (paused) paused = false; else startGame();
      return;
    }
    want = Math.abs(dx) > Math.abs(dy) ? DIRS[dx > 0 ? 3 : 1] : DIRS[dy > 0 ? 2 : 0];
  }, { passive: false });
  canvas.addEventListener('click', () => { if (paused) paused = false; else startGame(); });

  pad.querySelectorAll('button').forEach(b => {
    b.addEventListener('pointerdown', e => {
      e.preventDefault();
      initAudio();
      want = DIRS[+b.dataset.d];
      if (state === 'title') startGame();
    });
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && inGame()) paused = true;
  });
  addEventListener('resize', resize);

  // ---------- main loop ----------
  resize();
  let last = performance.now(), acc = 0;
  function loop(now) {
    acc += Math.min(0.1, (now - last) / 1000);
    last = now;
    while (acc >= STEP) { update(STEP); acc -= STEP; }
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // hook for automated testing
  window.__pacman = {
    get state() { return state; }, get score() { return score; }, get lives() { return lives; },
    get level() { return level; }, get dotsLeft() { return dotsLeft; }, set dotsLeft(v) { dotsLeft = v; }, get grid() { return grid; },
    get pac() { return pac; }, get ghosts() { return ghosts; },
  };
})();
</script>
</body>
</html>
